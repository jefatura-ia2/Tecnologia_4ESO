# /etc/mosquitto/conf.d/smart_sign.conf
# Smart Sign IoT · broker del servidor del instituto (misión 5 de TEC_IVJP_lab27)
#
#   sudo apt install mosquitto mosquitto-clients
#   sudo cp mosquitto.conf /etc/mosquitto/conf.d/smart_sign.conf
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd cartel     # usuario de los carteles
#   sudo mosquitto_passwd    /etc/mosquitto/passwd panel      # usuario del panel del profesor
#   sudo systemctl restart mosquitto
#
# Cortafuegos: abrir 1883 y 9001 SOLO para la red local del centro, nunca hacia Internet.
#   sudo ufw allow from 192.168.0.0/16 to any port 1883 proto tcp
#   sudo ufw allow from 192.168.0.0/16 to any port 9001 proto tcp

per_listener_settings false

# Carteles (ESP32-C3): MQTT sobre TCP
listener 1883
protocol mqtt

# Panel del profesor (navegador): MQTT sobre WebSockets
listener 9001
protocol websockets

# Seguridad: usuarios con contraseña.
# Solo para una prueba rápida en una red aislada: allow_anonymous true (y comentar password_file).
allow_anonymous false
password_file /etc/mosquitto/passwd

# Guardar los mensajes retenidos (el último estado de cada aula) aunque se reinicie el servidor
persistence true
persistence_location /var/lib/mosquitto/
