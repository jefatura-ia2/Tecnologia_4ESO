<script>
  const canvas = document.getElementById('lienzo');
  const caja = canvas.parentElement;
  let width = caja.clientWidth, height = caja.clientHeight;
  canvas.width = width; canvas.height = height;
</script>
<script>// Montaje I2C: PN532 + Raspberry Pi Pico W sobre protoboard. Unidades = mm.
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, width / height, 0.5, 2000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const P = 2.54;
const colX = c => (c - 15.5) * P;
const ROWZ = { A:-13.97, B:-11.43, C:-8.89, D:-6.35, E:-3.81,
               F:3.81, G:6.35, H:8.89, I:11.43, J:13.97 };
const RAILZ = [-22.86, -20.32, 20.32, 22.86];

const mat = {
  yellow: new THREE.MeshStandardMaterial({ color: 0xeed24a, roughness: 0.58 }),
  yellowDark: new THREE.MeshStandardMaterial({ color: 0xd4bb3b, roughness: 0.65 }),
  hole:   new THREE.MeshStandardMaterial({ color: 0x1a1504, roughness: 0.95 }),
  green:  new THREE.MeshStandardMaterial({ color: 0x1d6b4f, roughness: 0.55 }),
  red:    new THREE.MeshStandardMaterial({ color: 0xb02c22, roughness: 0.5 }),
  white:  new THREE.MeshStandardMaterial({ color: 0xefe9dc, roughness: 0.7 }),
  black:  new THREE.MeshStandardMaterial({ color: 0x16191b, roughness: 0.72 }),
  gold:   new THREE.MeshStandardMaterial({ color: 0xcfa63f, roughness: 0.32, metalness: 0.85 }),
  silver: new THREE.MeshStandardMaterial({ color: 0xc3cbcf, roughness: 0.28, metalness: 0.88 }),
  cream:  new THREE.MeshStandardMaterial({ color: 0xe6dfc9, roughness: 0.8 }),
  desk:   new THREE.MeshStandardMaterial({ color: 0x7c5433, roughness: 0.9 })
};

function box(w, h, d, m, x, y, z, parent) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z);
  o.castShadow = true; o.receiveShadow = true;
  (parent || scene).add(o);
  return o;
}

// ---------------------------------------------------------------- mesa
const desk = box(400, 4, 400, mat.desk, 0, -11, -20);
desk.castShadow = false;

// ---------------------------------------------------------- protoboard
box(84, 9, 54, mat.yellow, 0, -4.5, 0);
box(80, 1.6, 5.2, mat.yellowDark, 0, -0.5, 0);
[[-24.3, 0xc6453a], [-18.9, 0x3f6cc2], [18.9, 0x3f6cc2], [24.3, 0xc6453a]]
  .forEach(function (e) {
    box(76, 0.12, 0.55, new THREE.MeshStandardMaterial({ color: e[1], roughness: 0.8 }), 0, 0.06, e[0]);
  });

const hp = [];
for (let c = 1; c <= 30; c++)
  Object.keys(ROWZ).forEach(r => hp.push([colX(c), -0.55, ROWZ[r]]));
RAILZ.forEach(z => { for (let c = 2; c <= 29; c++) if (c % 6 !== 1) hp.push([colX(c), -0.55, z]); });

const holes = new THREE.InstancedMesh(new THREE.BoxGeometry(1.6, 1.1, 1.6), mat.hole, hp.length);
const mtx = new THREE.Matrix4();
hp.forEach((p, i) => { mtx.makeTranslation(p[0], p[1], p[2]); holes.setMatrixAt(i, mtx); });
holes.instanceMatrix.needsUpdate = true;
scene.add(holes);

// ------------------------------------------------- Raspberry Pi Pico W
// columnas 6..25, pines en las filas C y H, USB a la derecha (+x)
const C0 = 6, C1 = 25, PICO_Y = 9.2;

box(51, 1.1, 21, mat.green, 0, PICO_Y, 0);
box(5, 1.2, 19, mat.cream, -23, PICO_Y + 0.1, 0);
box(11.5, 1.3, 11.5, mat.silver, -15.5, PICO_Y + 0.9, 0);
box(7, 1.2, 7, mat.black, 2.5, PICO_Y + 0.9, 0);
box(4.2, 1, 3.4, mat.black, 9.5, PICO_Y + 0.8, 2);
box(3.2, 1.4, 3.2, mat.white, 16.5, PICO_Y + 1, -2.5);
box(7.5, 3, 6.2, mat.silver, 27, PICO_Y + 1.2, 0);
for (let i = 0; i < 3; i++) box(1.6, 0.3, 1.6, mat.gold, -8, PICO_Y + 0.7, -2.54 + i * 2.54);

[ROWZ.C, ROWZ.H].forEach(z => {
  box(51.5, 8.4, 2.6, mat.black, 0, 4.2, z);
  for (let c = C0; c <= C1; c++) box(1.1, 0.5, 1.1, mat.gold, colX(c), PICO_Y + 0.6, z);
});

// --------------------------------------------------------- modulo PN532
const MX = 10, MZ = -48, MY = -8.2;
function pbox(w, h, d, m, x, y, z) { return box(w, h, d, m, x, y, z); }

pbox(43, 1.6, 40, mat.red, MX, MY, MZ);
[-19, 19].forEach(dz => pbox(41, 0.12, 2.6, mat.white, MX, MY + 0.86, MZ + dz));
[-20, 20].forEach(dx => pbox(2.6, 0.12, 36, mat.white, MX + dx, MY + 0.86, MZ));
for (let i = 0; i < 2; i++) {
  const o = 5 + i * 3.4;
  pbox(37 - o * 2, 0.1, 0.7, mat.cream, MX, MY + 0.85, MZ - 17 + o);
  pbox(37 - o * 2, 0.1, 0.7, mat.cream, MX, MY + 0.85, MZ + 17 - o);
  pbox(0.7, 0.1, 34 - o * 2, mat.cream, MX - 18 + o, MY + 0.85, MZ);
  pbox(0.7, 0.1, 34 - o * 2, mat.cream, MX + 18 - o, MY + 0.85, MZ);
}
pbox(7, 1, 7, mat.black, MX - 2, MY + 1.3, MZ + 2);
for (let i = 0; i < 6; i++) pbox(1.2, 0.5, 2, mat.cream, MX - 10 + i * 2.6, MY + 1, MZ + 12);

pbox(2, 0.9, 1.4, new THREE.MeshStandardMaterial({
  color: 0xff6a55, emissive: 0xff2a14, emissiveIntensity: 1.6, roughness: 0.4 }),
  MX + 7, MY + 1.2, MZ + 1);
const ledGlow = new THREE.PointLight(0xff4a30, 0.55, 26);
ledGlow.position.set(MX + 7, MY + 4, MZ + 1);
scene.add(ledGlow);

// interruptores: I2C = 1 ON, 2 OFF
pbox(7, 2.2, 5, mat.white, MX + 10, MY + 1.9, MZ - 14);
pbox(2.4, 1, 1.9, mat.black, MX + 8.6, MY + 3.1, MZ - 15);
pbox(2.4, 1, 1.9, mat.black, MX + 11.4, MY + 3.1, MZ - 13);

[[-17.5, -15.5], [17.5, 15.5]].forEach(function (e) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.7, 8, 20), mat.cream);
  r.rotation.x = Math.PI / 2;
  r.position.set(MX + e[0], MY + 0.9, MZ + e[1]);
  scene.add(r);
});

// regleta de 8 pines (SPI), sin usar
pbox(23, 2.4, 2.6, mat.black, MX - 5, MY + 2, MZ - 18.5);
for (let i = 0; i < 8; i++) pbox(0.64, 6, 0.64, mat.gold, MX - 14 + i * 2.54, MY + 3.5, MZ - 18.5);

// regleta lateral de 4 pines (I2C): SCL, SDA, VCC, GND
const HX = MX + 18.5, HY = MY + 2;
const HZ = { SCL: MZ - 3.81, SDA: MZ - 1.27, VCC: MZ + 1.27, GND: MZ + 3.81 };
pbox(2.6, 2.4, 13, mat.black, HX, HY, MZ);
Object.keys(HZ).forEach(k => pbox(0.64, 6, 0.64, mat.gold, HX, MY + 3.5, HZ[k]));

// ------------------------------------------------------------- cables
function wire(pts, color) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const m = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 120, 0.68, 10, false),
    new THREE.MeshStandardMaterial({ color: color, roughness: 0.42 }));
  m.castShadow = true;
  scene.add(m);
}
function dupont(x, z, color) {
  box(2.6, 5.4, 2.6, mat.black, x, 2.7, z);
  box(2.2, 1.1, 2.2, new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 }), x, 5.2, z);
}

const COL = { SCL: 0xe3b73a, SDA: 0x2f6fd0, VCC: 0xd6372c, GND: 0x15181a };
const Y0 = MY + 5.5;

wire([[HX, Y0, HZ.SCL], [HX + 5, Y0 + 7, HZ.SCL + 1], [HX + 7, Y0 + 20, MZ + 8],
      [10, Y0 + 26, -34], [3, Y0 + 20, -24], [colX(16), 11, -17],
      [colX(16), 5.4, ROWZ.A]], COL.SCL);
wire([[HX, Y0, HZ.SDA], [HX + 4, Y0 + 6, HZ.SDA + 2], [HX + 4, Y0 + 18, MZ + 11],
      [11, Y0 + 23, -32], [6, Y0 + 17, -23], [colX(17), 10, -17],
      [colX(17), 5.4, ROWZ.A]], COL.SDA);
wire([[HX, Y0, HZ.GND], [HX + 3, Y0 + 5, HZ.GND + 3], [HX + 1, Y0 + 14, MZ + 15],
      [12, Y0 + 18, -30], [9, Y0 + 13, -22], [colX(18), 9, -17],
      [colX(18), 5.4, ROWZ.A]], COL.GND);
wire([[HX, Y0, HZ.VCC], [HX + 9, Y0 + 8, MZ + 4], [HX + 16, Y0 + 22, -40],
      [40, Y0 + 30, -22], [38, Y0 + 32, 0], [30, Y0 + 26, 14], [20, 14, 18],
      [colX(21), 8, 16.5], [colX(21), 5.4, ROWZ.J]], COL.VCC);

dupont(colX(16), ROWZ.A, COL.SCL);
dupont(colX(17), ROWZ.A, COL.SDA);
dupont(colX(18), ROWZ.A, COL.GND);
dupont(colX(21), ROWZ.J, COL.VCC);

// ------------------------------------------------------------ etiquetas
function label(text, x, y, z, accent, sc) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(11,15,17,0.92)';
  if (g.roundRect) { g.beginPath(); g.roundRect(6, 28, 500, 72, 36); g.fill(); }
  else g.fillRect(6, 28, 500, 72);
  g.strokeStyle = accent || '#f2b705'; g.lineWidth = 5; g.stroke();
  g.font = '600 44px ui-monospace, Menlo, monospace';
  g.fillStyle = '#f7f3e6'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 64);
  const w = Math.max(8, text.length * 2.15 + 3.5) * (sc || 1);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  s.scale.set(w, w * 0.25, 1);
  s.position.set(x, y, z);
  s.renderOrder = 10;
  scene.add(s);
}
function leader(from, to, color) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(from[0], from[1], from[2]),
    new THREE.Vector3(to[0], to[1], to[2])]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: color, transparent: true, opacity: 0.7, depthTest: false }));
  l.renderOrder = 9;
  scene.add(l);
}
// etiquetas escalonadas en altura para que no se pisen entre si
label('GP7 · SCL', -24, 13, ROWZ.A - 7, '#e3b73a', 0.8);
label('GP6 · SDA', -6, 21, ROWZ.A - 7, '#2f6fd0', 0.8);
label('GND · pin 8', 20, 27, ROWZ.A - 7, '#b9c2c0', 0.8);
leader([-24, 11.9, ROWZ.A - 7], [colX(16), 5.6, ROWZ.A], 0xe3b73a);
leader([-6, 19.9, ROWZ.A - 7], [colX(17), 5.6, ROWZ.A], 0x2f6fd0);
leader([20, 25.9, ROWZ.A - 7], [colX(18), 5.6, ROWZ.A], 0xb9c2c0);
label('3V3 · pin 36', colX(21) + 24, 20, ROWZ.J + 13, '#d6372c', 0.95);
leader([colX(21) + 24, 18.7, ROWZ.J + 13], [colX(21), 5.6, ROWZ.J], 0xd6372c);
label('I2C · 1 ON 2 OFF', MX + 1, MY + 27, MZ - 4, '#f2b705', 0.55);

// --------------------------------------------------------------- luces
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 0.85);
key.position.set(55, 95, 35);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -110; key.shadow.camera.right = 110;
key.shadow.camera.top = 110; key.shadow.camera.bottom = -110;
key.shadow.camera.near = 1; key.shadow.camera.far = 320;
scene.add(key);
const fill = new THREE.DirectionalLight(0xbdd4e0, 0.32);
fill.position.set(-60, 45, -75);
scene.add(fill);

// -------------------------------------------------------------- camara
camera.position.set(58, 100, -156);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(4, -2, -24);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 45;
controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI / 2.05;
controls.autoRotate = false;
controls.update();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
<script>
  addEventListener('resize', function () {
    const w = caja.clientWidth, h = caja.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  });
</script>
</body>
</html>
