<text x="450.0" y="380" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" style="font-family:'Inter','Segoe UI',Arial,sans-serif" >La prensa solo baja si los dos pulsadores se pulsan con menos de 0,5 s de diferencia y se mantienen pulsados.</text></svg>