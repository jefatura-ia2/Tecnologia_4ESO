<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Diagrama de tiempos del mando bimanual con ventana de 0,5 s"><title>Diagrama de tiempos del mando bimanual con ventana de 0,5 s</title><rect width="100%" height="100%" fill="#ffffff"/><text x="295" y="34" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold" style="font-family:'Inter','Segoe UI',Arial,sans-serif" >Caso correcto</text>
