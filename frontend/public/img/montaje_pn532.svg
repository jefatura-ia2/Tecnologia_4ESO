<text x="450.0" y="506" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" style="font-family:'Inter','Segoe UI',Arial,sans-serif" >El TX de uno va al RX del otro. Cambia los interruptores SEL0/SEL1 sin alimentación.</text></svg>