<text x="450.0" y="600" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" style="font-family:'Inter','Segoe UI',Arial,sans-serif" >Etapa 0 → (MARCHA con A y B dentro) → 1 A+ → (a1) → 2 B+ → (b1) → 3 B− → (b0) → 4 A− → (a0) → vuelta a 0.</text></svg>