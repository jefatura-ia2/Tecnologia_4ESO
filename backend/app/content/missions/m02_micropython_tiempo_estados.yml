            - {desc: "Verde mucho tiempo sin petición → sigue verde", call: "paso('VERDE', 60000, False)", expected: "VERDE"}
            - {desc: "Ámbar 2 s → rojo", call: "(paso('AMBAR', 1999, False), paso('AMBAR', 2000, False))", expected: ["AMBAR", "ROJO"]}
