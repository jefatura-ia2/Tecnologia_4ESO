            def paso(estado, t, peticion):
                pass
          solution: |
            def paso(estado, t, peticion):
                if estado == "VERDE":
                    if t >= 5000 and peticion:
                        return "AMBAR"
                    return "VERDE"
                if estado == "AMBAR":
                    return "ROJO" if t >= 2000 else "AMBAR"
                if estado == "ROJO":
                    return "VERDE" if t >= 5000 else "ROJO"
                return estado
