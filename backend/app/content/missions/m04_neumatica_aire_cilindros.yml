          solution: |
            import math

            def informe_elevador(masa, p, D):
                necesaria = round(masa * 9.81 * 1.5, 1)
                cilindro = round(p * 0.1 * math.pi * D ** 2 / 4, 1)
                return {"necesaria": necesaria, "cilindro": cilindro, "sube": cilindro >= necesaria}
          tests:
