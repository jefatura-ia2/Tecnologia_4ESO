      ### Proyecto por equipos (3 sesiones)

      1. **Montaje**: dos cilindros con sus sensores sobre una base de madera; útil de marcado en B.
      2. **Programa** por sensores con ciclo único (MARCHA) y continuo (MARCHA mantenido); PARO al final del ciclo.
