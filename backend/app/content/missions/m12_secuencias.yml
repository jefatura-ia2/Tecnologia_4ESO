    evaluation:
      intro: "Proyecto corto de la misión 12. Necesitas un 80 %."
      items:
        - id: c1
          type: code
          points: 5
          prompt: |
            Escribe `tiempo_ciclo(texto, tiempos)` (suma de los tiempos de los movimientos del texto, redondeada a 2
            decimales) y `piezas_hora(t_ciclo, pausa)` (`3600 // (t_ciclo + pausa)`, como entero).
          starter: |
            def tiempo_ciclo(texto, tiempos):
                pass

            def piezas_hora(t_ciclo, pausa):
                pass
          solution: |
            def tiempo_ciclo(texto, tiempos):
                total = 0
                for mov in texto.split():
                    total += tiempos[mov]
                return round(total, 2)

            def piezas_hora(t_ciclo, pausa):
                return int(3600 // (t_ciclo + pausa))
          tests:
