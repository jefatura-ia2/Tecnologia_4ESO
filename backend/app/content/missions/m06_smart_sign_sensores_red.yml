            Escribe `nota_proyecto(notas)` que reciba un diccionario con las notas (0-10) de los cinco criterios y
            devuelva la media ponderada redondeada a 2 decimales. Claves y pesos: `"paralelo"` 20 %,
            `"hito"` 15 %, `"software"` 25 %, `"investigacion"` 15 %, `"agil"` 25 %.

            Ejemplo: todas 8 salvo `"software"` 6 → `7.5`
          starter: |
            def nota_proyecto(notas):
                pass
          solution: |
            PESOS = {"paralelo": 0.20, "hito": 0.15, "software": 0.25, "investigacion": 0.15, "agil": 0.25}

            def nota_proyecto(notas):
                return round(sum(notas[c] * p for c, p in PESOS.items()), 2)
          tests:
            - {desc: "Ejemplo", call: "nota_proyecto({'paralelo': 8, 'hito': 8, 'software': 6, 'investigacion': 8, 'agil': 8})", expected: 7.5}
            - {desc: "Todo 10", call: "nota_proyecto({'paralelo': 10, 'hito': 10, 'software': 10, 'investigacion': 10, 'agil': 10})", expected: 10.0}
            - {desc: "Notas variadas", call: "nota_proyecto({'paralelo': 7, 'hito': 9, 'software': 5, 'investigacion': 6, 'agil': 10})", expected: 7.4}
        - id: c2
          type: code
          points: 3
          prompt: |
            Escribe `resumen_pasillo(estados)` que reciba `{aula: color}` y devuelva un diccionario con cuántas
            aulas hay `"libres"` (verde), `"ocupadas"` (rojo) y `"reservadas"` (azul). Los demás colores no cuentan.
          starter: |
            def resumen_pasillo(estados):
                pass
          solution: |
            def resumen_pasillo(estados):
                nombres = {"verde": "libres", "rojo": "ocupadas", "azul": "reservadas"}
                r = {"libres": 0, "ocupadas": 0, "reservadas": 0}
                for color in estados.values():
                    if color in nombres:
                        r[nombres[color]] += 1
                return r
          tests:
            - {desc: "Pasillo", call: "resumen_pasillo({'105': 'verde', '106': 'rojo', '203': 'rojo', '204': 'azul', '205': 'apagado'})", expected: {"libres": 1, "ocupadas": 2, "reservadas": 1}}
            - {desc: "Vacío", call: "resumen_pasillo({})", expected: {"libres": 0, "ocupadas": 0, "reservadas": 0}}
