                pass
          solution: |
            def consumo(v, r):
                i = v / r
                return round(i, 2), round(v * i, 1)
          tests:
            - {desc: "Cerradura de 20 Ω", call: "consumo(12, 20)", expected: [0.6, 7.2]}
            - {desc: "Bobina de 15 Ω", call: "consumo(12, 15)", expected: [0.8, 9.6]}
        - id: c2
          type: code
          points: 5
          prompt: |
            Escribe la clase `Cerradura`:

            - `Cerradura(pin, t_max_ms=3000)`: crea `self.pin = Pin(pin, Pin.OUT, value=0)` y `self.aperturas = 0`.
            - `abrir(t_ms)`: activa el pin, espera `min(t_ms, t_max_ms)` milisegundos con `time.sleep_ms`, lo
              desactiva **siempre** (usa `try/finally`), suma 1 a `aperturas` y devuelve el tiempo que ha estado abierta.
          starter: |
            from machine import Pin
            import time

            class Cerradura:
                def __init__(self, pin, t_max_ms=3000):
                    pass

                def abrir(self, t_ms):
                    pass
          solution: |
            from machine import Pin
            import time

            class Cerradura:
                def __init__(self, pin, t_max_ms=3000):
                    self.pin = Pin(pin, Pin.OUT, value=0)
                    self.t_max_ms = t_max_ms
                    self.aperturas = 0

                def abrir(self, t_ms):
                    t = min(t_ms, self.t_max_ms)
                    try:
                        self.pin.on()
                        time.sleep_ms(t)
                    finally:
                        self.pin.off()
                    self.aperturas += 1
                    return t
          required:
            - {pattern: "finally", message: "Usa try/finally para garantizar que la cerradura se desactiva."}
          tests:
            - before: ["_c = Cerradura(10)"]
              desc: "Arranca cerrada (pin a 0)"
              check: "_c.pin.value() == 0 and _c.aperturas == 0"
            - before: ["_log.clear()", "_clock.sleeps.clear()", "_c = Cerradura(10, 3000)", "_r = _c.abrir(5000)"]
              desc: "Nunca más de t_max: pide 5 s y abre 3 s"
              check: "_r == 3000 and abs(sum(_clock.sleeps) - 3.0) < 0.01"
            - before: ["_log.clear()", "_c = Cerradura(10)", "_c.abrir(1000)", "_c.abrir(500)"]
              desc: "Activa y desactiva el pin y cuenta aperturas"
              check: "('pin', 10, 'value', 1) in _log and _log[-1] == ('pin', 10, 'value', 0) and _c.aperturas == 2"
          hints:
            wrong_result: "Calcula t = min(t_ms, self.t_max_ms); dentro de try activa y espera; en finally desactiva."
        - id: c3
          type: code
          points: 4
          prompt: |
            Escribe `pintar(tira, rgb, brillo)` que ponga **todos** los LED de la tira del color `rgb` (una tupla
            `(r, g, b)`) multiplicado por `brillo` (cada componente convertida a entero con `int`) y llame a
            `tira.write()` **una sola vez** al final.

            Ejemplo: con `brillo = 0.25`, el naranja `(255, 70, 0)` queda `(63, 17, 0)`.
          starter: |
            def pintar(tira, rgb, brillo):
                pass
          solution: |
            def pintar(tira, rgb, brillo):
                r, g, b = rgb
                valor = (int(r * brillo), int(g * brillo), int(b * brillo))
                for i in range(len(tira)):
                    tira[i] = valor
                tira.write()
          tests:
            - before: ["from machine import Pin", "from neopixel import NeoPixel", "_t = NeoPixel(Pin(22), 8)", "_log.clear()", "pintar(_t, (255, 70, 0), 0.25)"]
              desc: "Naranja al 25 % en los 8 LED"
              check: "[e for e in _log if e[0] == 'neopixel'] == [('neopixel', 22, 'write', [(63, 17, 0)] * 8)]"
            - before: ["from machine import Pin", "from neopixel import NeoPixel", "_t = NeoPixel(Pin(3), 5)", "_log.clear()", "pintar(_t, (0, 0, 255), 1.0)"]
              desc: "Azul pleno en una tira de 5 LED"
              check: "_log[-1] == ('neopixel', 3, 'write', [(0, 0, 255)] * 5)"
            - before: ["from machine import Pin", "from neopixel import NeoPixel", "_t = NeoPixel(Pin(22), 8)", "_log.clear()", "pintar(_t, (255, 255, 255), 0)"]
              desc: "Brillo 0 apaga la tira"
              check: "_t[0] == (0, 0, 0) and _t[7] == (0, 0, 0)"
          hints:
            wrong_result: "Calcula el color escalado una vez, recorre range(len(tira)) asignando tira[i] = valor y llama a tira.write() fuera del bucle."

  - id: m3s4
    title: "Proyecto corto: control de acceso NFC"
    hours: 3
    kind: challenge
    foto:
      indicaciones: "Foto del control de acceso: lector PN532, tira WS2812 encendida, cerradura de 12 V, módulo MOSFET, diodo y placa. Si podéis, con una tarjeta junto al lector."
    theory: |
      ## El encargo

      Un control de acceso para el armario de herramientas del taller:

      - Lista de tarjetas **autorizadas** (UID en hexadecimal).
      - Lector **PN532 por I2C** y **tira WS2812** como semáforo: azul mientras espera una tarjeta.
      - Tarjeta autorizada → **ABRIR** la cerradura 3 s con la tira en **verde**.
      - Tarjeta desconocida → **DENEGADO** con la tira en **rojo**.
      - **3 intentos fallidos seguidos** → **BLOQUEO** durante 30 s: mientras dure, cualquier tarjeta
        (aunque esté autorizada) recibe **BLOQUEADO**. La tira se pone **naranja**.
      - Un acceso correcto pone a cero los fallos.
      - Cada intento se registra en la consola (o en un archivo) con la hora.

      | Pieza | Pico W | ESP32-S3 |
      |---|---|---|
      | PN532 (I2C, 1 = ON, 2 = OFF) | SDA GP6 · SCL GP7 · 3V3 · GND | SDA GPIO 10 · SCL GPIO 11 · 3V3 · GND |
      | Tira WS2812 (DIN) | GP22 · 5V a VBUS | GPIO 21 · 5V |
      | Cerradura (canal 1 del MOSFET) | GP10 | GPIO 4 |

      El estado se guarda en un diccionario:

      ```python
      estado = {"fallos": 0, "bloqueo_hasta": 0}
      ```

      ## Seguridad y privacidad

      El UID de muchas tarjetas se puede **copiar**: sirve para un armario del aula, no para un banco.
      Los sistemas serios usan tarjetas con **cifrado**. Además, un registro de accesos son **datos
      personales**: hay que informar a quien se registra y no guardarlos más tiempo del necesario.
    examples:
      - title: "Control de acceso completo: PN532 por I2C, tira WS2812 y cerradura"
        explanation: "Copia pn532_i2c.py en la placa. Pega tus funciones procesar(), color_estado() y pintar(), y cambia AUTORIZADAS por los UID de tus tarjetas."
        pico_w: |
          from machine import Pin, I2C
          from neopixel import NeoPixel
          import time
          from pn532_i2c import PN532, uid_hex

          AUTORIZADAS = {"04:A2:3B:1C", "7A:10:9F:33"}
          BRILLO = 0.25
          COLORES = {"verde": (0, 255, 0), "rojo": (255, 0, 0), "naranja": (255, 70, 0), "azul": (0, 0, 255)}

          nfc = PN532(I2C(1, sda=Pin(6), scl=Pin(7), freq=100_000))
          if nfc.version_firmware() is None or not nfc.configurar():
              raise SystemExit("PN532 no responde: revisa cables e interruptores (1 = ON, 2 = OFF)")
          tira = NeoPixel(Pin(22, Pin.OUT), 8)
          cerradura = Pin(10, Pin.OUT, value=0)
          estado = {"fallos": 0, "bloqueo_hasta": 0}

          # ... pega aquí procesar(), color_estado() y pintar() ...

          pintar(tira, COLORES["azul"], BRILLO)          # esperando tarjeta
          while True:
              uid = nfc.leer_uid(500)
              if uid:
                  codigo = uid_hex(uid)
                  accion = procesar(codigo, estado, AUTORIZADAS, time.ticks_ms())
                  print(time.ticks_ms() // 1000, "s", codigo, accion)
                  pintar(tira, COLORES[color_estado(accion)], BRILLO)
                  if accion == "ABRIR":
                      try:
                          cerradura.on(); time.sleep(3)
                      finally:
                          cerradura.off()
                  else:
                      time.sleep(1.5)
                  pintar(tira, COLORES["azul"], BRILLO)
              time.sleep_ms(150)
        esp32_s3: |
          from machine import Pin, I2C
          from neopixel import NeoPixel
          import time
          from pn532_i2c import PN532, uid_hex

          AUTORIZADAS = {"04:A2:3B:1C", "7A:10:9F:33"}
          BRILLO = 0.25
          COLORES = {"verde": (0, 255, 0), "rojo": (255, 0, 0), "naranja": (255, 70, 0), "azul": (0, 0, 255)}

          nfc = PN532(I2C(0, sda=Pin(10), scl=Pin(11), freq=100_000))
          if nfc.version_firmware() is None or not nfc.configurar():
              raise SystemExit("PN532 no responde: revisa cables e interruptores (1 = ON, 2 = OFF)")
          tira = NeoPixel(Pin(21, Pin.OUT), 8)
          cerradura = Pin(4, Pin.OUT, value=0)
          estado = {"fallos": 0, "bloqueo_hasta": 0}

          # ... pega aquí procesar(), color_estado() y pintar() ...

          pintar(tira, COLORES["azul"], BRILLO)          # esperando tarjeta
          while True:
              uid = nfc.leer_uid(500)
              if uid:
                  codigo = uid_hex(uid)
                  accion = procesar(codigo, estado, AUTORIZADAS, time.ticks_ms())
                  print(time.ticks_ms() // 1000, "s", codigo, accion)
                  pintar(tira, COLORES[color_estado(accion)], BRILLO)
                  if accion == "ABRIR":
                      try:
                          cerradura.on(); time.sleep(3)
                      finally:
                          cerradura.off()
                  else:
                      time.sleep(1.5)
                  pintar(tira, COLORES["azul"], BRILLO)
              time.sleep_ms(150)
    practice: |
      ### Proyecto por parejas (3 sesiones)

      1. **Montaje**: PN532 por I2C + tira WS2812 + cerradura con el módulo MOSFET. Revisión del profesor antes
         de los 12 V.
      2. **Programación**: completa `procesar()` y `color_estado()` y pruébalas aquí antes de pasarlas a la placa.
      3. **Pruebas y presentación**: demuestra apertura, denegación, bloqueo y desbloqueo. Muestra en el
         osciloscopio la señal de la cerradura durante una apertura.

      **Ampliación**: guarda el registro en `accesos.csv` (como en la misión 11) o añade un pulsador interior
      para salir sin tarjeta.
    evaluation:
      intro: "Proyecto corto de la misión 3. Necesitas un 75 %."
      items:
        - id: c1
          type: code
          points: 6
          prompt: |
            Escribe `procesar(uid, estado, autorizados, t_ms)` que devuelva la acción y **modifique** `estado`:

            1. Si `t_ms < estado["bloqueo_hasta"]` → `"BLOQUEADO"` (no cambia nada más).
            2. Si `uid` está en `autorizados` → `estado["fallos"] = 0` y `"ABRIR"`.
            3. Si no: suma 1 a `estado["fallos"]`. Si llega a 3 → `estado["bloqueo_hasta"] = t_ms + 30000`,
               `estado["fallos"] = 0` y `"BLOQUEO"`; si no, `"DENEGADO"`.
          starter: |
            def procesar(uid, estado, autorizados, t_ms):
                pass
          solution: |
            def procesar(uid, estado, autorizados, t_ms):
                if t_ms < estado["bloqueo_hasta"]:
                    return "BLOQUEADO"
                if uid in autorizados:
                    estado["fallos"] = 0
                    return "ABRIR"
                estado["fallos"] += 1
                if estado["fallos"] >= 3:
                    estado["bloqueo_hasta"] = t_ms + 30000
                    estado["fallos"] = 0
                    return "BLOQUEO"
                return "DENEGADO"
          tests:
            - before: ["_E = {'fallos': 0, 'bloqueo_hasta': 0}", "_A = {'04:A2:3B:1C'}"]
              desc: "Tarjeta autorizada → ABRIR"
              call: "procesar('04:A2:3B:1C', _E, _A, 1000)"
              expected: "ABRIR"
            - before: ["_E = {'fallos': 0, 'bloqueo_hasta': 0}", "_A = {'04:A2:3B:1C'}"]
              desc: "Tres fallos → bloqueo de 30 s, después vuelve a abrir"
              call: "([procesar('FF:FF', _E, _A, t) for t in (1000, 2000, 3000)], procesar('04:A2:3B:1C', _E, _A, 4000), procesar('04:A2:3B:1C', _E, _A, 34000))"
              expected: [["DENEGADO", "DENEGADO", "BLOQUEO"], "BLOQUEADO", "ABRIR"]
            - before: ["_E = {'fallos': 0, 'bloqueo_hasta': 0}", "_A = {'04:A2:3B:1C'}"]
              desc: "Un acceso correcto pone a cero los fallos"
              call: "(procesar('AA', _E, _A, 1), procesar('AA', _E, _A, 2), procesar('04:A2:3B:1C', _E, _A, 3), procesar('AA', _E, _A, 4), _E['fallos'])"
              expected: ["DENEGADO", "DENEGADO", "ABRIR", "DENEGADO", 1]
          hints:
            wrong_result: "Respeta el orden: primero el bloqueo, después la lista de autorizados y por último los fallos."
        - id: c2
          type: code
          points: 2
          prompt: |
            Escribe `color_estado(accion)` que devuelva el nombre del color de la tira para cada acción:
            `"ABRIR"` → `"verde"`, `"DENEGADO"` → `"rojo"`, `"BLOQUEO"` y `"BLOQUEADO"` → `"naranja"`;
            cualquier otra cosa (esperando tarjeta) → `"azul"`.
          starter: |
            def color_estado(accion):
                pass
          solution: |
            def color_estado(accion):
                if accion == "ABRIR":
                    return "verde"
                if accion == "DENEGADO":
                    return "rojo"
                if accion in ("BLOQUEO", "BLOQUEADO"):
                    return "naranja"
                return "azul"
          tests:
            - {desc: "Abrir y denegar", call: "(color_estado('ABRIR'), color_estado('DENEGADO'))", expected: ["verde", "rojo"]}
            - {desc: "Bloqueo y bloqueado", call: "(color_estado('BLOQUEO'), color_estado('BLOQUEADO'))", expected: ["naranja", "naranja"]}
            - {desc: "Esperando", call: "(color_estado('ESPERA'), color_estado(''))", expected: ["azul", "azul"]}
