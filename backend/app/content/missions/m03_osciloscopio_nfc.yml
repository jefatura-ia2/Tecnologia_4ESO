              time.sleep_ms(20)
      - title: "Tira WS2812: los colores del control de acceso"
        explanation: "Tira de 8 LED con DIN en GP22 (Pico W) o GPIO 21 (ESP32-S3), 5V y GND. Recorre los cuatro colores; para probar uno, para el programa y escribe en la consola: color(\"azul\")."
        pico_w: |
          from machine import Pin
          from neopixel import NeoPixel
          import time

          NUM_LEDS = 8
          BRILLO = 0.25                     # de 0.0 a 1.0 (consumo: ver la teoría)
          tira = NeoPixel(Pin(22, Pin.OUT), NUM_LEDS)   # DIN → GP22 · 5V → VBUS · GND → GND

          COLORES = {"verde": (0, 255, 0), "rojo": (255, 0, 0), "naranja": (255, 70, 0),
                     "azul": (0, 0, 255), "apagado": (0, 0, 0)}

          def color(nombre):
              r, g, b = COLORES[nombre]
              valor = (int(r * BRILLO), int(g * BRILLO), int(b * BRILLO))
              for i in range(NUM_LEDS):
                  tira[i] = valor
              tira.write()

          try:
              while True:
                  for nombre in ("verde", "rojo", "naranja", "azul"):
                      print(nombre)
                      color(nombre)
                      time.sleep(1)
          except KeyboardInterrupt:          # al pulsar Stop en Thonny
              color("apagado")
        esp32_s3: |
