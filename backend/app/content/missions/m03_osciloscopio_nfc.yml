          COLORES = {"verde": (0, 255, 0), "rojo": (255, 0, 0), "naranja": (255, 70, 0),
                     "azul": (0, 0, 255), "apagado": (0, 0, 0)}

          def color(nombre):
              r, g, b = COLORES[nombre]
              valor = (int(r * BRILLO), int(g * BRILLO), int(b * BRILLO))
              for i in range(NUM_LEDS):
                  tira[i] = valor
              tira.write()

          try:
              while True:
                  for nombre in ("verde", "rojo", "naranja", "azul"):
                      print(nombre)
                      color(nombre)
                      time.sleep(1)
          except KeyboardInterrupt:          # al pulsar Stop en Thonny
              color("apagado")
    practice: |
      ### Práctica de taller

      1. Mide con el polímetro la resistencia de la bobina y calcula corriente y potencia a 12 V.
      2. Monta la cerradura con el módulo MOSFET y el diodo (revisa el profesor antes de conectar los 12 V).
      3. **Osciloscopio**: mide a la vez la señal de la placa (CH1, sonda x1 o x10) y el drenador del MOSFET
