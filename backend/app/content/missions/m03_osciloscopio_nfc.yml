sections:
  - id: m3s1
    title: "Introducción al osciloscopio PROMAX serie 600"
    hours: 2
    kind: lesson
    foto:
      indicaciones: "Foto de tu montaje de la práctica funcionando: que se vean la placa, el cableado y los componentes (y los tubos y cilindros si hay neumática)."
    theory: |
      ## ¿Para qué sirve un osciloscopio?

      El polímetro da **un número**; el osciloscopio dibuja **cómo cambia la tensión con el tiempo**.
      Así vemos señales que cambian miles de veces por segundo: la PWM de la placa, la conmutación de una
      electroválvula o la comunicación serie con un sensor.

      Los PROMAX de la **serie OD-600** (OD-603, OD-606, OD-610…) son osciloscopios digitales con pantalla
      en color, 2 o 4 canales, medidas automáticas, cursores y FFT.

      ## La pantalla: una cuadrícula

      ![Panel de un osciloscopio digital con sus mandos numerados](/img/osc_panel.svg)
      *Mandos principales de un osciloscopio digital (esquema genérico de la serie OD-600).*

      - Eje **vertical** = tensión. Mando **VOLTS/DIV** (V/div): cuántos voltios vale cada cuadro.
      - Eje **horizontal** = tiempo. Mando **SEC/DIV** (s/div): cuánto tiempo vale cada cuadro.
      - La pantalla tiene normalmente **10 divisiones horizontales** y **8 verticales**.

      ```
      tensión = divisiones verticales × (V/div)
      periodo T = divisiones horizontales de un ciclo × (s/div)
      frecuencia f = 1 / T
      ciclo de trabajo = t_encendido / T × 100 %
      ```

      Ejemplo: una onda cuadrada ocupa 3,3 divisiones de alto con 1 V/div → **3,3 V**. Un ciclo ocupa
      5 divisiones con 0,2 ms/div → T = 1 ms → **f = 1000 Hz**.

      ![Lectura de tensión, periodo y ciclo de trabajo en la pantalla](/img/osc_lectura_pwm.svg)
      *Contar divisiones y multiplicar por la escala.*

      ## Primeros pasos con el PROMAX

      1. Conecta la **sonda** al canal 1 (CH1). Pon el conmutador de la sonda en **x10** y, en el menú
         del canal (botón **CH1**), indica **Sonda/Probe x10**: si no coinciden, las medidas salen 10 veces mal.
      2. **Compensa la sonda**: engancha la punta al terminal de calibración del osciloscopio (onda cuadrada
         de 1 kHz) y la pinza a su masa. Si las esquinas no son rectas, gira el tornillo de ajuste de la sonda.

      ![Tres ondas: sonda subcompensada, correcta y sobrecompensada](/img/osc_compensacion.svg)
      *Compensación de la sonda con la salida de calibración de 1 kHz.*

      3. Pulsa **AUTOSET** (ajuste automático) para que el osciloscopio elija escalas. Después afina con
         VOLTS/DIV y SEC/DIV.
      4. **Disparo (TRIGGER)**: fija la imagen. Elige fuente CH1, flanco de subida y un nivel a media altura
         de la señal. Si la imagen «corre», el disparo está mal.
      5. **MEASURE**: añade medidas automáticas de frecuencia, periodo, Vpp, Vmax y ciclo de trabajo
         (*duty*). Con **CURSOR** mides a mano entre dos líneas.

      ## Seguridad con el osciloscopio

      - La **pinza de masa** de la sonda está unida a la toma de tierra del enchufe: engánchala **solo** a la
        masa (GND) del circuito, nunca a otro punto.
      - En el taller medimos como máximo los **12 V** de la fuente. **Nunca** se mide la red de 230 V.
      - Para 12 V usa la sonda en **x10**.
    examples:
      - title: "Generador de señales PWM para medir con el osciloscopio"
        explanation: "Conecta la punta de la sonda al pin de salida y la pinza a GND. Cambia FRECUENCIA y CICLO y observa la pantalla."
        pico_w: |
          from machine import Pin, PWM
          import time

          FRECUENCIA = 1000      # Hz
          CICLO = 50             # % del tiempo en alto

          pwm = PWM(Pin(22))     # GP22: punta de la sonda · GND: pinza
          pwm.freq(FRECUENCIA)
          pwm.duty_u16(int(CICLO * 65535 / 100))
          print("Mide en el osciloscopio: f =", FRECUENCIA, "Hz · ciclo =", CICLO, "%")

          # Después prueba un barrido de ciclos de trabajo
          for c in (25, 50, 75):
              pwm.duty_u16(int(c * 65535 / 100))
              print("Ciclo", c, "%")
              time.sleep(5)
        esp32_s3: |
          from machine import Pin, PWM
          import time

          FRECUENCIA = 1000      # Hz
          CICLO = 50             # % del tiempo en alto

          pwm = PWM(Pin(21))     # GPIO 21: punta de la sonda · GND: pinza
          pwm.freq(FRECUENCIA)
          pwm.duty_u16(int(CICLO * 65535 / 100))
          print("Mide en el osciloscopio: f =", FRECUENCIA, "Hz · ciclo =", CICLO, "%")

          # Después prueba un barrido de ciclos de trabajo
          for c in (25, 50, 75):
              pwm.duty_u16(int(c * 65535 / 100))
              print("Ciclo", c, "%")
              time.sleep(5)
    practice: |
      ### Práctica de laboratorio (por parejas)

      ![Pico W con la sonda del osciloscopio en GP22 y la pinza en GND](/img/montaje_pwm.svg)
      *Montaje: sonda en la salida PWM y pinza de masa en GND.*

      1. **Compensa la sonda** con la señal de calibración del osciloscopio. Dibuja en el cuaderno la onda
         antes y después del ajuste.
      2. Ejecuta el generador PWM (1 kHz, 50 %). Rellena la tabla midiendo **a mano** (contando divisiones)
         y con **MEASURE**:

         | Ajuste | V/div | s/div | Vmax medida | Periodo | Frecuencia | Ciclo |
         |---|---|---|---|---|---|---|
         | 1 kHz · 50 % | | | | | | |
         | 1 kHz · 25 % | | | | | | |
         | 5 kHz · 75 % | | | | | | |

      3. Cambia SEC/DIV para ver **2 ciclos** y luego **10 ciclos** en pantalla.
      4. Quita el disparo (nivel fuera de la señal): ¿qué pasa con la imagen?
    evaluation:
      intro: "Necesitas un 75 %."
      items:
        - id: q1
          type: quiz
          points: 1
          question: "La sonda está en x10 y el canal del osciloscopio en x1. ¿Qué ocurre?"
          options:
            - {id: a, text: "Las tensiones que muestra son 10 veces más pequeñas que las reales."}
            - {id: b, text: "Nada, el osciloscopio lo corrige solo.", feedback: "Hay que indicar en el menú del canal la misma atenuación que en la sonda."}
            - {id: c, text: "Las tensiones salen 10 veces mayores.", feedback: "La sonda x10 divide la señal entre 10; si el canal no lo sabe, muestra valores 10 veces menores."}
          answer: a
        - id: q2
          type: quiz
          points: 1
          question: "La imagen de la onda se desplaza sin parar por la pantalla. ¿Qué ajustas?"
          options:
            - {id: a, text: "El disparo (TRIGGER): fuente, flanco y nivel dentro de la señal."}
            - {id: b, text: "El brillo de la pantalla.", feedback: "El problema es de sincronización, no de brillo."}
            - {id: c, text: "La escala VOLTS/DIV.", feedback: "VOLTS/DIV cambia la altura, no fija la imagen."}
          answer: a
        - id: q3
          type: quiz
          points: 1
          question: "¿Dónde se engancha la pinza de masa de la sonda?"
          options:
            - {id: a, text: "Solo a la masa (GND) del circuito."}
            - {id: b, text: "A cualquier punto, da igual.", feedback: "La pinza está unida a la tierra del enchufe: en otro punto provocarías un cortocircuito."}
            - {id: c, text: "Al positivo de 12 V.", feedback: "¡Nunca! Cortocircuitarías la fuente a través de la tierra."}
          answer: a
        - id: f1
          type: fill_blank
          points: 1
          text: "La frecuencia es la inversa del periodo: f = 1 / ___. Si un ciclo ocupa 4 divisiones con 5 ms/div, el periodo es ___ ms."
          blanks:
            - {accept: ["T", "periodo"], hint: "La letra del periodo."}
            - {accept: ["20"], hint: "Divisiones × ms/div."}
        - id: c1
          type: code
          points: 3
          prompt: |
            Escribe dos funciones para pasar de divisiones a magnitudes:

            - `tension(div, v_div)` → tensión en voltios, redondeada a 2 decimales.
            - `frecuencia(div, s_div)` → frecuencia en Hz de una señal cuyo periodo ocupa `div` divisiones
              con `s_div` segundos por división, redondeada a 1 decimal.

            Ejemplos: `tension(3.3, 1)` → `3.3` · `frecuencia(5, 0.0002)` → `1000.0`
          starter: |
            def tension(div, v_div):
                pass

            def frecuencia(div, s_div):
                pass
          solution: |
            def tension(div, v_div):
                return round(div * v_div, 2)

            def frecuencia(div, s_div):
                periodo = div * s_div
                return round(1 / periodo, 1)
          tests:
            - {desc: "3,3 div a 1 V/div", call: "tension(3.3, 1)", expected: 3.3}
            - {desc: "12 V con 2,4 div a 5 V/div", call: "tension(2.4, 5)", expected: 12.0}
            - {desc: "1 kHz", call: "frecuencia(5, 0.0002)", expected: 1000.0}
            - {desc: "50 Hz", call: "frecuencia(4, 0.005)", expected: 50.0}
          hints:
            wrong_result: "Primero calcula el periodo (divisiones × s/div) y después f = 1 / periodo."
        - id: c2
          type: code
          points: 3
          prompt: |
            Escribe:

            - `ciclo_trabajo(t_on, periodo)` → porcentaje del periodo en alto, redondeado a 1 decimal.
            - `duty_u16(porcentaje)` → valor entero para `pwm.duty_u16()` (0 = 0 %, 65535 = 100 %).

            Ejemplos: `ciclo_trabajo(0.25, 1)` → `25.0` · `duty_u16(50)` → `32767`
          starter: |
            def ciclo_trabajo(t_on, periodo):
                pass

            def duty_u16(porcentaje):
                pass
          solution: |
            def ciclo_trabajo(t_on, periodo):
                return round(100 * t_on / periodo, 1)

            def duty_u16(porcentaje):
                return int(porcentaje * 65535 / 100)
          tests:
            - {desc: "25 %", call: "ciclo_trabajo(0.25, 1)", expected: 25.0}
            - {desc: "0,75 ms en alto de 1 ms", call: "ciclo_trabajo(0.00075, 0.001)", expected: 75.0}
            - {desc: "duty 50 %", call: "duty_u16(50)", expected: 32767}
            - {desc: "duty 0 % y 100 %", call: "(duty_u16(0), duty_u16(100))", expected: [0, 65535]}

  - id: m3s2
    title: "NFC: leer tarjetas con el PN532 por I2C"
    hours: 2
    kind: lesson
    foto:
      indicaciones: "Foto del PN532 conectado por I2C a la placa (SDA, SCL, 3V3 y GND visibles) y, si puedes, la consola de Thonny mostrando el UID de una tarjeta."
    theory: |
      ## NFC y RFID

      Las tarjetas **NFC** (13,56 MHz) no llevan pila: el lector crea un campo magnético que las alimenta y
      ellas responden con su **UID** (identificador único), por ejemplo `04:A2:3B:1C`. Las usamos en
      transporte, bibliotecas, hoteles o para fichar.

      ## El módulo PN532 NFC RFID V3

      Puede comunicarse de tres formas, que se eligen con los **dos interruptores** de la placa:

      | Modo | SEL0 (1) | SEL1 (2) |
      |---|---|---|
      | HSU (puerto serie) | OFF | OFF |
      | **I2C** ← usaremos este | **ON** | **OFF** |
      | SPI | OFF | ON |

      ⚠️ Cambia los interruptores **sin alimentación**.

      ## El bus I2C: dos cables para muchos dispositivos

      I2C usa solo **dos líneas**: **SDA** (datos) y **SCL** (reloj, la marca la placa). Cada dispositivo
      tiene una **dirección**; la del PN532 es **0x24** (36 en decimal). Con `i2c.scan()` la placa pregunta
      quién hay conectado: si aparece `0x24`, el cableado es correcto.

      **Conexión** (conector de 4 pines del módulo; guíate por los nombres serigrafiados, el orden cambia según el fabricante):

      | PN532 | Pico W (bus I2C1) | ESP32-S3 |
      |---|---|---|
      | SDA | GP6 (pin físico 9) | GPIO 10 |
      | SCL | GP7 (pin físico 10) | GPIO 11 |
      | VCC | 3V3 (pin físico 36) | 3V3 |
      | GND | GND (pin físico 8) | GND |

      ![Conexión del PN532 V3 a la Pico W por I2C](/img/montaje_pn532.svg)
      *PN532 en modo I2C (1 = ON, 2 = OFF) conectado al bus I2C1 de la Pico W.*

      ### 🧊 El montaje en 3D

      Gira, acerca y desplaza el montaje para ver por dónde va cada cable.
      [Abrir el simulador a pantalla completa ↗](/simuladores/pn532_i2c_pico_w_3d.html)

      <iframe class="sim3d" src="/simuladores/pn532_i2c_pico_w_3d.html" title="Montaje 3D del PN532 por I2C con la Pico W" loading="lazy"></iframe>

      ## Cómo «habla» el PN532: tramas

      Cada mensaje viaja en una **trama** con comprobación de errores:

      ```
      00 00 FF | LEN | LCS | D4 CMD datos... | DCS | 00
      ```

      - `LEN` = número de bytes de datos; `LCS` = (256 − LEN) % 256, para que LEN + LCS acabe en 0.
      - `DCS` = (256 − suma de los datos) % 256, para que datos + DCS acabe en 0.
      - `D4` indica «de la placa al PN532»; las respuestas empiezan por `D5`.
      - Tras cada orden, el PN532 contesta primero un **ACK** (`00 00 FF 00 FF 00`) y luego la respuesta.

      Por I2C, antes de cada lectura el módulo envía un **byte de estado**: su bit 0 vale 1 cuando ya tiene
      la respuesta preparada. Así lo hace la librería `pn532_i2c.py`.

      ## La librería y el programa de prueba

      - [`pn532_i2c.py`](/descargas/pn532_i2c.py): la **librería**. No se ejecuta sola; cópiala en la raíz
        de la placa (o en `/lib`). Tiene `version_firmware()`, `configurar()`, `leer_uid()` y `uid_hex()`.
      - [`pn532_i2c_main.py`](/descargas/pn532_i2c_main.py): el **programa de prueba**. Guárdalo en la
        placa con el nombre **`main.py`**. Usa el LED de la Pico W como indicador:

      | LED de la placa | Significado |
      |---|---|
      | 3 parpadeos lentos al arrancar | el programa ha empezado |
      | parpadeo rápido y continuo | no encuentra el PN532 (revisa cables e interruptores) |
      | 2 parpadeos cortos | ha leído una tarjeta nueva |
      | encendido fijo | hay una tarjeta sobre la antena |

      > ¿Prefieres el puerto serie? Con los dos interruptores en OFF (HSU) puedes usar
      > [`pn532_uart.py`](/descargas/pn532_uart.py) con `UART(1, baudrate=115200, tx=Pin(4), rx=Pin(5))`.
    examples:
      - title: "Prueba del lector NFC por I2C (main.py)"
        explanation: "Copia pn532_i2c.py en la placa y guarda este programa como main.py. Acerca tarjetas y anota sus UID."
        pico_w: |
          from machine import Pin, I2C
          import time
          from pn532_i2c import PN532, uid_hex

          PIN_SDA, PIN_SCL = 6, 7          # bus I2C1 de la Pico W
          led = Pin("LED", Pin.OUT)

          def parpadeo(veces, ms=120):
              for _ in range(veces):
                  led.on(); time.sleep_ms(ms)
                  led.off(); time.sleep_ms(ms)

          parpadeo(3, 200)                  # el programa ha arrancado
          i2c = I2C(1, sda=Pin(PIN_SDA), scl=Pin(PIN_SCL), freq=100_000)
          print("Dispositivos I2C:", [hex(d) for d in i2c.scan()])   # debe salir 0x24

          nfc = PN532(i2c)
          version = nfc.version_firmware()
          if version is None:
              raise SystemExit("El PN532 no responde: interruptores 1 = ON, 2 = OFF")
          print("PN532 firmware {}.{}".format(*version))
          nfc.configurar()

          ultimo = None
          while True:
              uid = nfc.leer_uid(500)
              if uid:
                  if uid != ultimo:
                      print("Tarjeta:", uid_hex(uid))
                      parpadeo(2, 60)
                      ultimo = uid
                  led.on()                  # tarjeta encima de la antena
              else:
                  if ultimo is not None:
                      print("Tarjeta retirada")
                  ultimo = None
                  led.off()
              time.sleep_ms(200)
        esp32_s3: |
          from machine import Pin, I2C
          import time
          from pn532_i2c import PN532, uid_hex

          PIN_SDA, PIN_SCL = 10, 11
          i2c = I2C(0, sda=Pin(PIN_SDA), scl=Pin(PIN_SCL), freq=100_000)
          print("Dispositivos I2C:", [hex(d) for d in i2c.scan()])   # debe salir 0x24

          nfc = PN532(i2c)
          version = nfc.version_firmware()
          if version is None:
              raise SystemExit("El PN532 no responde: interruptores 1 = ON, 2 = OFF")
          print("PN532 firmware {}.{}".format(*version))
          nfc.configurar()

          ultimo = None
          while True:
              uid = nfc.leer_uid(500)
              if uid and uid != ultimo:
                  print("Tarjeta:", uid_hex(uid))
              if not uid and ultimo is not None:
                  print("Tarjeta retirada")
              ultimo = uid
              time.sleep_ms(200)
    practice: |
      ### Práctica en clase

      1. Pon los interruptores en **I2C (1 = ON, 2 = OFF)**, conecta el módulo como en el simulador 3D y
         ejecuta `i2c.scan()`: debe aparecer `0x24`.
      2. Copia `pn532_i2c.py` y `main.py` en la placa y lee el UID de 3 tarjetas distintas. Comprueba los
         mensajes del LED.
      3. **Con el osciloscopio** (CH1 en SCL, CH2 en SDA, pinzas a GND): mide el periodo del reloj SCL.
         A 100 kHz debe ser de 10 µs. Observa cómo SDA cambia mientras SCL está en bajo.
      4. ¿Qué distancia máxima de lectura consigues? ¿Funciona a través de un cuaderno? ¿Y de una lámina de
         aluminio?
    evaluation:
      intro: "Necesitas un 75 %."
      items:
        - id: q1
          type: quiz
          points: 1
          question: "¿Cómo se alimenta una tarjeta NFC que no tiene pila?"
          options:
            - {id: a, text: "Con el campo magnético que crea la antena del lector."}
            - {id: b, text: "Con una pila de botón escondida.", feedback: "Las tarjetas pasivas no llevan pila."}
            - {id: c, text: "Con la luz del aula.", feedback: "La energía llega por el campo magnético del lector."}
          answer: a
        - id: q2
          type: quiz
          points: 1
          question: "Para usar el PN532 V3 por I2C, ¿cómo van los interruptores?"
          options:
            - {id: a, text: "1 (SEL0) en ON y 2 (SEL1) en OFF."}
            - {id: b, text: "Los dos en OFF.", feedback: "Esa combinación es el puerto serie (HSU)."}
            - {id: c, text: "1 en OFF y 2 en ON.", feedback: "Esa combinación es SPI."}
          answer: a
        - id: q3
          type: quiz
          points: 1
          question: "Ejecutas i2c.scan() y devuelve una lista vacía. ¿Qué revisas primero?"
          options:
            - {id: a, text: "Los cables SDA, SCL, VCC y GND (y que no estén cruzados SDA con SCL)."}
            - {id: b, text: "La tarjeta NFC.", feedback: "scan() no necesita tarjeta: busca el módulo en el bus."}
            - {id: c, text: "La versión de Thonny.", feedback: "Una lista vacía significa que ningún dispositivo responde en el bus: es el cableado."}
          answer: a
        - id: c1
          type: code
          points: 3
          prompt: |
            Escribe `uid_hex(uid)` (como la de la librería) que reciba una lista de bytes (números de 0 a 255) y
            devuelva el texto en hexadecimal con **dos cifras en mayúsculas** separadas por `:`. Lista vacía → `""`.

            Ejemplo: `uid_hex([4, 162, 59, 28])` → `"04:A2:3B:1C"`
          starter: |
            def uid_hex(uid):
                pass
          solution: |
            def uid_hex(uid):
                partes = []
                for b in uid:
                    partes.append("%02X" % b)
                return ":".join(partes)
          tests:
            - {desc: "Ejemplo", call: "uid_hex([4, 162, 59, 28])", expected: "04:A2:3B:1C"}
            - {desc: "UID de 7 bytes", call: "uid_hex([4, 1, 2, 3, 4, 5, 255])", expected: "04:01:02:03:04:05:FF"}
            - {desc: "Vacía", call: "uid_hex([])", expected: ""}
          hints:
            wrong_result: "\"%02X\" % numero escribe el número en hexadecimal con 2 cifras y mayúsculas. Une las partes con \":\".join(lista)."
        - id: c2
          type: code
          points: 4
          prompt: |
            Escribe `trama(datos)` que construya la trama del PN532 como **lista de números**:

            `[0x00, 0x00, 0xFF, LEN, LCS] + datos + [DCS, 0x00]`

            con `LEN = len(datos)`, `LCS = (256 - LEN) % 256` y `DCS = (256 - sum(datos) % 256) % 256`.

            Ejemplo: `trama([0xD4, 0x02])` → `[0, 0, 255, 2, 254, 212, 2, 42, 0]`
          starter: |
            def trama(datos):
                pass
          solution: |
            def trama(datos):
                n = len(datos)
                lcs = (256 - n) % 256
                dcs = (256 - sum(datos) % 256) % 256
                return [0x00, 0x00, 0xFF, n, lcs] + list(datos) + [dcs, 0x00]
          tests:
            - {desc: "GetFirmwareVersion", call: "trama([0xD4, 0x02])", expected: [0, 0, 255, 2, 254, 212, 2, 42, 0]}
            - {desc: "Leer tarjeta (InListPassiveTarget)", call: "trama([0xD4, 0x4A, 0x01, 0x00])", expected: [0, 0, 255, 4, 252, 212, 74, 1, 0, 225, 0]}
            - {desc: "LEN + LCS y datos + DCS acaban en 0", check: "(lambda t: (t[3] + t[4]) % 256 == 0 and (sum(t[5:-2]) + t[-2]) % 256 == 0)(trama([0xD4, 0x14, 0x01, 0x14, 0x01]))"}
          hints:
            wrong_result: "Construye la lista por partes: cabecera [0, 0, 255, LEN, LCS], después los datos y al final [DCS, 0]."

  - id: m3s3
    title: "Actuadores: cerradura de 12 V y tira de LED WS2812"
    hours: 2
    kind: lesson
    foto:
      indicaciones: "Foto del montaje de la cerradura (placa, módulo MOSFET, diodo y fuente de 12 V) y de la tira WS2812 encendida en un color."
    theory: |
      ## Cómo funciona

      Dentro de la cerradura hay una **bobina** (solenoide) y un pestillo de hierro con muelle:

      - Sin corriente, el muelle mantiene el pestillo **cerrado** (*fail-secure*: si se va la luz, la puerta
        sigue cerrada).
      - Con **12 V**, la bobina atrae el pestillo y la puerta **se abre**.

      ## Conexión

      La placa (3,3 V, pocos mA) **no** puede mover la cerradura (12 V, ≈ 0,5-1 A). Usamos el mismo
      **módulo MOSFET** que con las electroválvulas:

      ![Montaje de la cerradura de 12 V con módulo MOSFET, diodo y Pico W](/img/montaje_cerradura.svg)
      *Montaje completo con los dos puntos de medida para el osciloscopio.*

      - El **diodo de libre circulación** absorbe el pico de tensión que genera la bobina al cortar la
        corriente. Sin él, el MOSFET puede romperse.
      - Estas cerraduras **no** están pensadas para estar activadas mucho tiempo: se calientan. Abriremos
        como máximo **3 s** cada vez.

      ## Potencia y corriente

      Con la ley de Ohm: `I = V / R` y `P = V · I`. Una cerradura de 12 V con una bobina de 20 Ω consume
      0,6 A y 7,2 W: la fuente debe dar al menos esa corriente (mejor con margen).

      ## Verlo con el osciloscopio

      Con la sonda en **x10**, mide en el **drenador del MOSFET** (pinza a GND): con la cerradura cerrada verás
      12 V; al abrir, la tensión cae a casi 0 V. Gracias al diodo, al cerrar no aparece un pico peligroso.

      ![Dos canales del osciloscopio: señal de la placa y drenador del MOSFET](/img/osc_cerradura.svg)
      *CH1: orden de la placa · CH2: drenador del MOSFET durante una apertura de 3 s.*

      ## La tira de LED WS2812 (NeoPixel): el semáforo del control de acceso

      Cada LED de una tira **WS2812** (formato 5050) lleva dentro su propio chip: con **un solo cable de datos**
      se elige el color de cada LED por separado. Los datos entran por **DIN**, cada LED se queda con su
      color y pasa el resto por **DOUT** al siguiente.

      | Pad de la tira | Va a |
      |---|---|
      | **DIN** (entrada de datos) | un pin de salida de la placa |
      | **5V** | 5 V (VBUS en la Pico W, 5V en las ESP32) |
      | **GND** | GND de la placa |
      | DOUT (extremo opuesto) | solo para encadenar otra tira |

      ![Pinout de una tira WS2812 de 8 LED: DIN a un lado, DOUT al otro](/img/tira_ws2812.svg)
      *Conecta siempre el extremo marcado **DIN**. La flecha impresa en la tira indica el sentido de los datos.*

      Cada color se da con tres números de 0 a 255: **(rojo, verde, azul)**. En el control de acceso usaremos:

      | Estado | Color | (R, G, B) |
      |---|---|---|
      | Esperando tarjeta | azul | (0, 0, 255) |
      | Acceso concedido | verde | (0, 255, 0) |
      | Acceso denegado | rojo | (255, 0, 0) |
      | Bloqueado | naranja | (255, 70, 0) |

      **Brillo y consumo.** Cada LED puede llegar a **60 mA** en blanco pleno: 8 LED son casi **0,5 A**.
      Por eso multiplicamos cada componente por un **brillo** (por ejemplo 0,25): con un color primario la
      tira consume unos 120 mA, que el pin de 5 V aguanta con la placa alimentada por USB. Si subes el brillo
      a 1,0, alimenta la tira con una fuente de 5 V aparte y **une las masas**.

      ### 🧊 Montaje en 3D con una ESP32-C3 SuperMini

      En el taller también hay placas **ESP32-C3 SuperMini**: la tira va con DIN → **IO3**, 5V → 5V y
      GND → GND. Programa de prueba: [`tira_colores.py`](/descargas/tira_colores.py) (recorre verde, rojo,
      naranja y azul). [Abrir el simulador a pantalla completa ↗](/simuladores/ws2812_esp32c3_3d.html)

      <iframe class="sim3d" src="/simuladores/ws2812_esp32c3_3d.html" title="Montaje 3D de la tira WS2812 con la ESP32-C3 SuperMini" loading="lazy"></iframe>
    examples:
      - title: "Abrir la cerradura 3 segundos al pulsar"
        explanation: "Cerradura en el canal 1 del módulo MOSFET. Pulsador MARCHA para probar. try/finally garantiza que la cerradura no se quede activada."
        pico_w: |
          from machine import Pin
          import time

          cerradura = Pin(10, Pin.OUT, value=0)     # canal 1 del módulo MOSFET
          boton = Pin(14, Pin.IN, Pin.PULL_UP)      # MARCHA

          def abrir(t_ms=3000):
              try:
                  cerradura.on()
                  time.sleep_ms(min(t_ms, 3000))      # nunca más de 3 s
              finally:
                  cerradura.off()

          while True:
              if boton.value() == 0:
                  print("Abriendo")
                  abrir()
                  time.sleep_ms(500)
              time.sleep_ms(20)
        esp32_s3: |
