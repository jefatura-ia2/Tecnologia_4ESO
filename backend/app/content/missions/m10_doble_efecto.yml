          solution: |
            def paso(estado, t, pulsado):
                if estado == "BAJADA":
                    return "SUBIENDO" if pulsado else "BAJADA"
                if estado == "SUBIENDO":
                    return "SUBIDA" if t >= 2000 else "SUBIENDO"
                if estado == "SUBIDA":
                    return "BAJANDO" if t >= 5000 else "SUBIDA"
                if estado == "BAJANDO":
                    if pulsado:
                        return "SUBIENDO"
                    return "BAJADA" if t >= 2000 else "BAJANDO"
                return estado

            def salidas(estado):
                if estado in ("SUBIENDO", "SUBIDA"):
                    return (1, 0)
                return (0, 1)
