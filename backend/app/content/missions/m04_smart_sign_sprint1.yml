sections:
  - id: m4s1
    title: "El reto Smart Sign y el método ágil"
    hours: 2
    kind: lesson
    theory: |
      ## El reto

      Vamos a construir un **cartel inteligente** para la puerta de un aula: una plancha de metacrilato de
      **160 × 120 mm** iluminada por el canto con una tira de LED que muestra el estado del aula
      (🟢 libre, 🔴 ocupada, 🔵 reservada…). Funciona con **batería**, se cuelga en la pared y, más adelante,
      el profesor lo cambiará desde una **App Web** del servidor del instituto.

      El proyecto dura cuatro misiones como un equipo de producto real:

      | Fase | Misión | Qué se consigue |
      |---|---|---|
      | **Sprint 1** · dos equipos en paralelo | 4 | Equipo A: soporte y marco impresos · Equipo B: electrónica y energía |
      | **Hito de integración** + **Sprint 2** | 5 | El cartel completo y autónomo · control remoto por MQTT |
      | **Sprint 3** + **Sprint 4** | 6 | Sensores (luz y movimiento) · red de carteles de todo el pasillo |

      ## Historias de usuario

      Los requisitos se escriben desde el punto de vista de quien usa el producto:

      > *Como **profesor**, quiero marcar mi aula como «Ocupada» desde el ordenador **para que** nadie
      > interrumpa un examen.*
      >
      > *Como **alumno**, quiero ver desde el pasillo si el aula está libre **para** saber si puedo entrar.*

      ## Scrum en el aula

      - **Sprint**: periodo corto (aquí, 3 semanas) con un **objetivo** claro (*Sprint Goal*).
      - **Daily** (5 minutos al empezar cada sesión): ¿qué hice?, ¿qué haré?, ¿qué me bloquea?
      - **Sprint Review**: cada equipo **enseña** lo que funciona. Nada de diapositivas: piezas y LED.
      - **Retrospectiva**: qué mejorar en el siguiente sprint.

      ## Tablero Kanban

      | Por hacer | En curso | Hecho |
      |---|---|---|
      | Modelar ranura | Probeta de tolerancias | Plano acotado |
      | Soldar TP4056 | | |

      Regla de oro: **pocas tareas «En curso» a la vez**. Una tarea solo pasa a «Hecho» si se puede enseñar.

      ## Dos equipos que dependen uno del otro

      - **Equipo A · Diseño y fabricación (mecánica)**: soporte de pared, marco y encaje del metacrilato.
      - **Equipo B · Electrónica y energía**: ESP32-C3, tira LED, batería 18650, cargador TP4056 y elevador MT3608.

      El Equipo A necesita las **medidas** de lo que va dentro; el Equipo B necesita saber **cuánto sitio**
      tiene. Por eso, el primer día se firma un **contrato de medidas** (una tabla en el README del proyecto):

      | Componente | Medidas máximas (mm) | Responsable |
      |---|---|---|
      | Batería 18650 en portapilas | 78 × 21 × 21 | B |
      | TP4056 (USB-C) | 28 × 17 × 5 | B |
      | MT3608 | 37 × 17 × 6 | B |
      | ESP32-C3 SuperMini | 23 × 18 × 4 | B |
      | Tira WS2812 de 12 LED | 160 × 10,5 × 3 | B |
      | Hueco interior del soporte | 171 × 40 × 22 (menos las 4 torretas de las esquinas) | A |

      **Rotación de roles**: cada semana algunos miembros cambian de equipo para que todos aprendan
      mecánica y electrónica. El cambio se apunta en el tablero.
    examples:
      - title: "Tablero Kanban en la consola"
        explanation: "Un tablero sencillo en Python para practicar listas y diccionarios. Funciona igual en cualquier placa o en el ordenador."
        pico_w: |
          tareas = [
              {"tarea": "Plano acotado", "equipo": "A", "estado": "Hecho", "puntos": 2},
              {"tarea": "Probeta de tolerancias", "equipo": "A", "estado": "En curso", "puntos": 3},
              {"tarea": "Soldar TP4056", "equipo": "B", "estado": "Por hacer", "puntos": 2},
          ]

          for columna in ("Por hacer", "En curso", "Hecho"):
              print("==", columna, "==")
              for t in tareas:
                  if t["estado"] == columna:
                      print("  [{}] {} ({} p)".format(t["equipo"], t["tarea"], t["puntos"]))
        esp32_s3: |
          tareas = [
              {"tarea": "Plano acotado", "equipo": "A", "estado": "Hecho", "puntos": 2},
              {"tarea": "Probeta de tolerancias", "equipo": "A", "estado": "En curso", "puntos": 3},
              {"tarea": "Soldar TP4056", "equipo": "B", "estado": "Por hacer", "puntos": 2},
          ]

          for columna in ("Por hacer", "En curso", "Hecho"):
              print("==", columna, "==")
              for t in tareas:
                  if t["estado"] == columna:
                      print("  [{}] {} ({} p)".format(t["equipo"], t["tarea"], t["puntos"]))
    practice: |
      ### Práctica en clase (por equipos de 4-6)

      1. Escribid **3 historias de usuario** del cartel (profesor, alumnado, conserjería).
      2. Montad el tablero Kanban (papel en la pared o un tablero de GitHub Projects) con las tareas del Sprint 1.
      3. Repartid los equipos A y B y **firmad el contrato de medidas**. Escribidlo en el README del repositorio.
      4. Definid el **Sprint Goal**: «Al final de la semana 12, el Equipo A enseña el metacrilato encajado en las
         piezas impresas y el Equipo B enseña la tira encendida con batería».
    evaluation:
      intro: "Necesitas un 75 %."
      items:
        - id: q1
          type: quiz
          points: 1
          question: "¿Qué se hace en la Sprint Review?"
          options:
            - {id: a, text: "Cada equipo enseña funcionando lo que ha terminado en el sprint."}
            - {id: b, text: "Se reparten las notas finales.", feedback: "Es una demostración del producto, no una evaluación final."}
            - {id: c, text: "Se hace una presentación de diapositivas sobre lo que se piensa hacer.", feedback: "Se enseña lo que ya funciona, no planes."}
          answer: a
        - id: q2
          type: quiz
          points: 1
          question: "¿Para qué sirve el contrato de medidas entre los equipos A y B?"
          options:
            - {id: a, text: "Para que la electrónica quepa en el soporte sin tener que reimprimirlo."}
            - {id: b, text: "Para repartir el presupuesto.", feedback: "Trata de dimensiones: es la interfaz entre mecánica y electrónica."}
            - {id: c, text: "Para decidir quién presenta la demo.", feedback: "Es un acuerdo técnico de dimensiones."}
          answer: a
        - id: c1
          type: code
          points: 3
          prompt: |
            Escribe `cuenta_kanban(tareas)` que reciba una lista de diccionarios con la clave `"estado"`
            (`"Por hacer"`, `"En curso"` o `"Hecho"`) y devuelva cuántas hay en cada columna:
            `{"Por hacer": n1, "En curso": n2, "Hecho": n3}` (con las tres claves aunque valgan 0).
          starter: |
            def cuenta_kanban(tareas):
                pass
          solution: |
            def cuenta_kanban(tareas):
                cuenta = {"Por hacer": 0, "En curso": 0, "Hecho": 0}
                for t in tareas:
                    cuenta[t["estado"]] += 1
                return cuenta
          tests:
            - {desc: "Tres tareas", call: "cuenta_kanban([{'estado': 'Hecho'}, {'estado': 'En curso'}, {'estado': 'Hecho'}])", expected: {"Por hacer": 0, "En curso": 1, "Hecho": 2}}
            - {desc: "Sin tareas", call: "cuenta_kanban([])", expected: {"Por hacer": 0, "En curso": 0, "Hecho": 0}}
        - id: c2
          type: code
          points: 3
          prompt: |
            Escribe `progreso_sprint(tareas)` que devuelva el porcentaje de **puntos** terminados (estado `"Hecho"`)
            sobre el total de puntos, redondeado a entero. Si no hay puntos, devuelve `0`.

            Ejemplo: tareas de 2 p (Hecho), 3 p (En curso) y 5 p (Hecho) → `70`
          starter: |
            def progreso_sprint(tareas):
                pass
          solution: |
            def progreso_sprint(tareas):
                total = sum(t["puntos"] for t in tareas)
                if total == 0:
                    return 0
                hechos = sum(t["puntos"] for t in tareas if t["estado"] == "Hecho")
                return round(100 * hechos / total)
          tests:
            - {desc: "Ejemplo", call: "progreso_sprint([{'estado': 'Hecho', 'puntos': 2}, {'estado': 'En curso', 'puntos': 3}, {'estado': 'Hecho', 'puntos': 5}])", expected: 70}
            - {desc: "Nada terminado", call: "progreso_sprint([{'estado': 'Por hacer', 'puntos': 4}])", expected: 0}
            - {desc: "Lista vacía", call: "progreso_sprint([])", expected: 0}

  - id: m4s2
    title: "Equipo A: diseño CAD y fabricación del soporte y el marco"
    hours: 3
    kind: lesson
    foto:
      indicaciones: "Foto de las piezas impresas (soporte, tapa y capuchón) con el metacrilato encajado, y de la probeta de tolerancias con el calibre."
    theory: |
      ## El producto que diseña el Equipo A

      El cartel es una plancha de **metacrilato de 5 mm** (160 × 120 mm) iluminada **por el canto**: la tira de
      LED va escondida bajo el borde inferior y la luz viaja por dentro del metacrilato. Donde el metacrilato
      está grabado o lijado, la luz «sale» y se ve el dibujo.

      ![Plano del cartel: vista frontal acotada y sección A-A del soporte con la ranura del metacrilato y la tira LED](/img/smart_sign_plano.svg)
      *Vista frontal y sección A-A. La ranura mide 5,2 mm: metacrilato de 5 mm + 0,2 mm de tolerancia.*

      ![Vista explosionada en 3D del cartel: tapa, soporte de pared, metacrilato y capuchón superior](/img/smart_sign_3d.png)
      *Vista explosionada del modelo paramétrico `marco_cartel.scad`: tapa, soporte, metacrilato y capuchón.*

      | Pieza | Medidas exteriores (mm) | Función | Impresora recomendada |
      |---|---|---|---|
      | **1. Soporte de pared** (caja base) | 176 × 45 × 38 | Sujeta el metacrilato, esconde la tira y aloja batería y electrónica. Se cuelga con dos ojales | Bambu Lab A1 (precisión de la ranura) |
      | **2. Tapa inferior** | 176 × 45 × 2 | Cierra la caja con 4 tornillos M3; acceso para cargar y reparar | Bambu Lab A1 |
      | **3. Capuchón superior** (marco) | 164 × 9 × 9 | Protege el canto superior y refleja la luz hacia dentro | Bambu Lab A1 |
      | Prototipos rápidos y piezas grandes | — | Pruebas de volumen, versiones en PETG | Artillery Sidewinder |

      ## Tolerancias: por qué la ranura no mide 5 mm

      Una impresora FDM deja las paredes un poco «gordas» (el plástico se aplasta) y el metacrilato real no mide
      exactamente 5,00 mm (puede variar ±0,2 mm). Si la ranura midiera 5,0 mm, el metacrilato **no entraría**.

      ```
      ranura = espesor del metacrilato + tolerancia = 5,0 + 0,2 = 5,2 mm
      juego  = ranura impresa (medida) − espesor medido del metacrilato
      ```

      | Juego medido | Resultado |
      |---|---|
      | menor que 0 | **no entra** |
      | de 0 a 0,1 mm | **justo**: entra a presión, puede rajar el metacrilato |
      | de 0,1 a 0,4 mm | **correcto** ✅ |
      | más de 0,4 mm | **flojo**: baila, hay que pegar o calzar |

      👉 **Mide siempre con el calibre** el metacrilato real antes de fijar la cota, e imprime una
      **probeta de tolerancias** (una pieza pequeña con ranuras de 5,0 · 5,1 · 5,2 · 5,3 · 5,4 mm) para ver
      cuál encaja mejor con *vuestra* impresora y *vuestro* metacrilato. En la Bambu Lab A1 se imprime en
      unos 10 minutos.

      ## Del plano al CAD

      **En Tinkercad** (rápido, para empezar):

      1. Caja de 176 × 45 × 38 mm. Hueco interior (agujero) de 171 × 40 × 22 abierto por abajo: paredes de 2,4 mm.
      2. Ranura: agujero de **160,4 × 5,2 × 10** mm centrado arriba.
      3. Canal de la tira: agujero de **162 × 11,1 × 3,6** mm justo debajo de la ranura, y un agujero de Ø5 mm
         para que pasen los cables de la tira a la caja.
      4. Dos **ojales** en la cara trasera (agujero de Ø8 + ranura de 4 mm hacia arriba) para colgar el soporte
         en dos tornillos de la pared.
      5. Hueco de 10 × 4 mm en un lateral para el **USB-C** del cargador TP4056.
      6. Cuatro torretas de Ø7 mm en las esquinas con agujero de Ø2,6 mm (rosca para M3) para la tapa.
      7. Comprueba que entre el hueco y el canal de la tira queda un «suelo» de 2,4 mm.

      **En Fusion 360 o OpenSCAD** (diseño **paramétrico**): las medidas son **parámetros**. Si el metacrilato
      mide 5,3 mm, se cambia un número y todo se recalcula. Modelo paramétrico de referencia:
      [`marco_cartel.scad`](/descargas/smart_sign/marco_cartel.scad) (se abre con OpenSCAD y se exporta a STL).
      Piezas ya exportadas para 5 mm y 0,2 mm de holgura:
      [soporte](/descargas/smart_sign/stl/soporte.stl) ·
      [tapa](/descargas/smart_sign/stl/tapa.stl) ·
      [capuchón](/descargas/smart_sign/stl/capuchon.stl) ·
      [probeta](/descargas/smart_sign/stl/probeta.stl).

      ![El soporte visto desde abajo: hueco de la electrónica, torretas para la tapa, ojales de pared y hueco del USB-C](/img/smart_sign_soporte_3d.png)
      *El soporte visto desde abajo: hueco de la electrónica, torretas M3, ojales para la pared y hueco del USB-C.*

      ```
      espesor_metacrilato = 5;     // mídelo con el calibre
      holgura = 0.2;               // la que mejor encaje en la probeta
      ranura = espesor_metacrilato + holgura;
      ```

      ## Fabricación: laminado e impresión

      | Parámetro | Valor recomendado | Por qué |
      |---|---|---|
      | Material | **PLA** (interior) · **PETG** si da el sol o está cerca de un radiador | El PLA se ablanda hacia 60 °C; el PETG aguanta unos 80 °C |
      | Altura de capa | 0,2 mm (0,12 mm para la probeta) | Equilibrio entre tiempo y precisión |
      | Perímetros | 4 (paredes de ~1,6-2,4 mm) | Resistencia en los ojales y las torretas |
      | Relleno | 15-20 % (giroide) | Ligero y suficiente |
      | Orientación | Soporte con la **ranura hacia arriba**, sin soportes | La ranura sale limpia y con medida fiable |
      | Soportes | Solo para el hueco del USB-C (o diséñalo con techo en arco de 45°) | Evitar soportes ahorra tiempo y plástico |
      | Color | Blanco o gris claro en el canal de la tira | Refleja la luz hacia el metacrilato |

      **Las dos impresoras del taller:**

      - **Bambu Lab A1** (volumen 256 × 256 × 256 mm): rápida y precisa. Para la probeta, la ranura y las
        piezas definitivas. Caben 2-3 iteraciones de la probeta en una sesión.
      - **Artillery Sidewinder** (volumen 300 × 300 × 400 mm): para piezas grandes, versiones en PETG o
        imprimir varias piezas a la vez mientras la A1 está ocupada.

      **Cuánto plástico gastamos:** `masa (g) = volumen (cm³) × densidad`. Densidad del PLA ≈ 1,24 g/cm³ y del
      PETG ≈ 1,27 g/cm³. El laminador da el volumen o los gramos: anótalo para calcular el coste.

      ## Variante: letrero tipo bandera (montaje 3D)

      Además del cartel de metacrilato, el centro estudia un **letrero tipo bandera**: sale perpendicular a la
      pared para que se lea desde lejos por el pasillo. Tiene dos módulos que se unen **sin cables sueltos**:

      | Módulo | Piezas | Función |
      |---|---|---|
      | **Pieza de pared** (base) | Base, tapa, Molex en su cuna, calzo de ajuste (0,5-2 mm), 2 tornillos M3 × 16 | Se atornilla a la pared y lleva la alimentación hasta el conector |
      | **Módulo carril** | Carril con espiga, Molex dentro de la espiga, tapa inferior del canal, reductor 12 → 5 V, ESP32-C3 SuperMini, 2 placas WS2812 de 8 LED, 2 tapas de PLA translúcido, letras | Ilumina el letrero; se enchufa a la base deslizándolo |

      Usa el visor para **despiezar** el conjunto, hacer un **corte por el eje**, ver la base transparente,
      ocultar piezas de la lista y mirar el **detalle de la unión**. Con el ratón: arrastrar para girar, rueda
      para acercar y clic derecho (o Mayús) para desplazar.

      <iframe class="sim3d" src="/simuladores/letrero_bandera_3d.html" title="Montaje 3D del letrero tipo bandera: carril y pieza de pared" loading="lazy" style="height:min(80vh, 640px)"></iframe>

      [Abrir el montaje 3D del letrero a pantalla completa](/simuladores/letrero_bandera_3d.html)

      | Ajuste | Holgura | Cómo se comprueba antes de imprimir |
      |---|---|---|
      | Espiga del carril ↔ alojamiento de la pieza de pared | 0,15 mm por cara | Galga `00b` |
      | Conectores Molex en sus huecos | 0,2 mm + nervios de aplastamiento | Galga `00a` |
      | Tapa LED translúcida ↔ rebaje del carril | 0,15 mm por cara | Galga `00a` |

      **¿Por qué los Molex entran rectos?** La espiga ya está **11,5 mm dentro** de su alojamiento cuando los
      conectores se tocan, así que llegan alineados. Es el mismo principio que la ranura del metacrilato: una
      **guía mecánica con poca holgura** hace el trabajo de precisión.

      Modelo paramétrico en Python (se cambian las medidas al principio y se regeneran los STL):
      [`letrero_aulas.py`](/descargas/smart_sign/letrero_bandera/letrero_aulas.py) ·
      [todas las piezas y galgas (ZIP de STL)](/descargas/smart_sign/letrero_bandera/letrero_bandera_stl.zip).

      **Secuencia de montaje**

      1. Encajar el Molex de la base en su cuna (queda con 0,4 mm de juego para centrarse solo) y meter detrás el calzo de 1,0 mm.
      2. Pegar el Molex del carril en el túnel de la espiga (asoma 9,5 mm).
      3. Colocar el reductor, la ESP32, las placas LED (tornillos M2) y las tapas LED; deslizar la tapa inferior por el extremo libre hasta que haga «clic».
      4. Empujar el carril: la **espiga se alinea antes de que se toquen los Molex** y la conexión se hace sola.
      5. Fijar con los 2 tornillos M3 × 16 desde debajo de la base. Si los Molex no enchufan a fondo, calzo más grueso; si el carril no llega a tope, más fino.

      > 💡 El **calzo** es una forma sencilla de absorber las tolerancias de impresión sin reimprimir la base:
      > es la misma idea que la probeta de las ranuras, aplicada a la profundidad de un conector.

      ## Seguridad en la zona de impresión

      - La boquilla está a más de 200 °C y la cama a 60 °C: **no se toca** mientras imprime.
      - Despega las piezas con la cama **fría** y la espátula hacia fuera, nunca hacia la mano.
      - Corte del metacrilato: solo con la **cortadora láser** y el profesor, con la tapa cerrada y extracción
        de humos. Retira el film protector **después** de cortar.
    examples:
      - title: "Modelo paramétrico del soporte (OpenSCAD)"
        explanation: "Abre marco_cartel.scad en OpenSCAD, cambia espesor_metacrilato y holgura por los valores medidos y exporta cada pieza a STL (F6 y luego Exportar STL)."
        lenguaje: openscad
        codigo: |
          // Fragmento de marco_cartel.scad: la ranura y el canal de la tira se calculan con parámetros
          ancho_metacrilato   = 160;    // mm
          espesor_metacrilato = 5;      // mídelo con el calibre
          holgura             = 0.2;    // la que mejor encaje en la probeta
          prof_ranura         = 10;
          ancho_tira          = 10.5;   // tira WS2812
          alto_tira           = 3;

          ranura = espesor_metacrilato + holgura;    // 5,2 mm
          L = ancho_metacrilato + 16;                // 176 mm
          P = 45; H = 38;

          module ranura_y_canal() {
              // ranura donde entra el metacrilato
              translate([(L - ancho_metacrilato - 0.4) / 2, (P - ranura) / 2, H - prof_ranura])
                  cube([ancho_metacrilato + 0.4, ranura, prof_ranura + 1]);
              // canal de la tira LED, justo debajo
              translate([(L - ancho_metacrilato - 2) / 2, (P - ancho_tira - 0.6) / 2, H - prof_ranura - alto_tira - 0.6])
                  cube([ancho_metacrilato + 2, ancho_tira + 0.6, alto_tira + 0.6]);
          }
      - title: "Probeta de tolerancias (OpenSCAD)"
        explanation: "Cinco ranuras de 5,0 a 5,4 mm (en marco_cartel.scad, pieza = \"probeta\"). Imprímela, prueba el metacrilato en cada una y apunta cuál queda «correcta»."
        lenguaje: openscad
        codigo: |
          // module probeta() de marco_cartel.scad
          espesor = 5;                                // espesor nominal del metacrilato
          holguras = [0, 0.1, 0.2, 0.3, 0.4];
          difference() {
              cube([len(holguras) * 14 + 4, 20, 12]);
              for (i = [0 : len(holguras) - 1])
                  translate([4 + i * 14, -1, 4])
                      cube([espesor + holguras[i], 22, 9]);
          }
          // número grabado encima de cada ranura: 0 1 2 3 4 (décimas de mm)
          for (i = [0 : len(holguras) - 1])
              translate([5 + i * 14, 2, 12]) linear_extrude(0.6) text(str(i), size = 5);
