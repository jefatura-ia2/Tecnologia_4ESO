          question: "¿Por qué la ranura para un metacrilato de 5 mm se diseña de 5,2 mm?"
          options:
            - {id: a, text: "Porque la impresión FDM engorda las paredes y el metacrilato no mide exactamente 5 mm: hace falta holgura."}
