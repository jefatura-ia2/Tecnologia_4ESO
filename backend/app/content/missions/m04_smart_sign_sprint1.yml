id: m4
number: 4
trimestre: 1
icon: "🪧"
title: "Smart Sign I: dos equipos en paralelo"
subtitle: "Proyecto Smart Sign IoT · Sprint 1: el Equipo A diseña e imprime el soporte y el marco; el Equipo B monta la electrónica y la energía"
weeks: [10, 11, 12]
hours: 9
objectives:
  - Organizar un proyecto con metodología ágil (Scrum y Kanban) y coordinar dos equipos que dependen el uno del otro.
  - Diseñar en CAD el soporte de pared y el marco de un cartel de 160 × 120 mm con un encaje de metacrilato de 5 mm y tolerancia de 0,2 mm.
  - Preparar e imprimir piezas en 3D (Bambu Lab A1 y Artillery Sidewinder) eligiendo material, orientación y parámetros.
  - Montar el sistema de energía del cartel (batería 18650, cargador TP4056 y elevador MT3608) y calcular consumos y autonomía.
  - Programar la ESP32-C3 SuperMini para encender la tira de LED y entrar en reposo profundo (deepsleep).
materials:
  - Ordenador con Tinkercad o Fusion 360 (y opcionalmente OpenSCAD) y el laminador Bambu Studio o Cura
  - Impresoras 3D Bambu Lab A1 y Artillery Sidewinder, filamento PLA y PETG, calibre digital
  - Plancha de metacrilato de 5 mm (160 × 120 mm), cortadora láser si la hay
  - ESP32-C3 SuperMini, tira WS2812 de 12 LED, batería 18650 con portapilas, módulo TP4056 con protección, elevador MT3608
  - Estación de soldadura, estaño, polímetro, KiCad o EasyEDA
criteria:
  - Diseña y fabrica objetos con herramientas CAD y de fabricación digital, aplicando tolerancias y normalización.
  - Diseña y monta circuitos electrónicos con gestión de energía, calculando consumos y autonomía.
  - Trabaja en equipo con metodologías ágiles, coordinando tareas interdependientes y comunicando decisiones técnicas.
schedule:
  - {week: 10, session: 1, title: "El reto Smart Sign: historias de usuario, Scrum y Kanban", section: m4s1}
  - {week: 10, session: 2, title: "Formar los equipos A y B y firmar el contrato de medidas", section: m4s1}
  - {week: 10, session: 3, title: "Equipo A: plano 160 × 120 y modelado CAD del soporte", section: m4s2}
  - {week: 11, session: 1, title: "Equipo A: encaje del metacrilato y probeta de tolerancias", section: m4s2}
  - {week: 11, session: 2, title: "Equipo A: laminado e impresión (Bambu Lab A1 / Sidewinder)", section: m4s2}
  - {week: 11, session: 3, title: "Equipo B: esquema de energía, PCB y soldadura", section: m4s3}
  - {week: 12, session: 1, title: "Equipo B: LED de prueba y consumo en deepsleep", section: m4s3}
