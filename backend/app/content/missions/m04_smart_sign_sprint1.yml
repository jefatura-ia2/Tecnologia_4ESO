          options:
            - {id: a, text: "PETG, porque aguanta más temperatura que el PLA."}
            - {id: b, text: "PLA, porque es el más fácil de imprimir.", feedback: "El PLA se ablanda hacia 60 °C: al sol, detrás de un cristal, se puede deformar."}
          answer: a
        - id: q3
          type: quiz
          points: 1
          question: "¿Cómo orientas el soporte en la cama de la impresora?"
          options:
            - {id: a, text: "Con la ranura hacia arriba, para que salga limpia y sin soportes."}
            - {id: b, text: "Con la ranura hacia abajo, apoyada en la cama.", feedback: "Necesitaría soportes dentro de la ranura y la medida saldría peor."}
            - {id: c, text: "De pie, sobre su lado más pequeño.", feedback: "Es inestable y las capas quedarían débiles en los ojales."}
          answer: a
        - id: q4
          type: quiz
          points: 1
          question: "En el letrero tipo bandera, ¿por qué los conectores Molex entran rectos al empujar el carril contra la pieza de pared?"
          options:
            - {id: a, text: "Porque la espiga entra 11,5 mm en su alojamiento antes de que los conectores se toquen, y llegan ya alineados."}
            - {id: b, text: "Porque los cables doblan los conectores hasta alinearlos.", feedback: "Los cables no guían nada: la alineación la da una pieza rígida con poca holgura."}
            - {id: c, text: "Porque los tornillos M3 los empujan a su sitio.", feedback: "Los tornillos se ponen al final, con el carril ya enchufado: solo lo bloquean."}
          answer: a
        - id: c1
          type: code
          points: 4
          prompt: |
            Escribe dos funciones:

            - `ranura(espesor, holgura)` → ancho de la ranura, redondeado a 2 decimales.
            - `encaje(espesor_medido, ranura_medida)` → según el juego (`ranura_medida − espesor_medido`):
              `"no entra"` si es menor que 0; `"justo"` si es menor que 0,1; `"correcto"` si es menor o igual que 0,4;
              `"flojo"` si es mayor. Redondea el juego a 2 decimales antes de comparar.

            Ejemplos: `ranura(5, 0.2)` → `5.2` · `encaje(5.05, 5.25)` → `"correcto"`
          starter: |
            def ranura(espesor, holgura):
                pass

            def encaje(espesor_medido, ranura_medida):
                pass
          solution: |
            def ranura(espesor, holgura):
                return round(espesor + holgura, 2)

            def encaje(espesor_medido, ranura_medida):
                juego = round(ranura_medida - espesor_medido, 2)
                if juego < 0:
                    return "no entra"
                if juego < 0.1:
                    return "justo"
                if juego <= 0.4:
                    return "correcto"
                return "flojo"
          tests:
            - {desc: "Ranura de 5,2 mm", call: "ranura(5, 0.2)", expected: 5.2}
            - {desc: "Encaje correcto", call: "encaje(5.05, 5.25)", expected: "correcto"}
            - {desc: "No entra y justo", call: "(encaje(5.2, 5.1), encaje(5.0, 5.05))", expected: ["no entra", "justo"]}
            - {desc: "Flojo y límite de 0,4 mm", call: "(encaje(4.8, 5.4), encaje(5.0, 5.4))", expected: ["flojo", "correcto"]}
          hints:
            wrong_result: "Calcula juego = round(ranura_medida - espesor_medido, 2) y compara en orden: < 0, < 0.1, <= 0.4, y el resto."
        - id: c2
          type: code
          points: 3
          prompt: |
            Escribe `impresora(pieza)` que reciba las medidas de una pieza `(x, y, z)` en mm y devuelva:
            `"Bambu Lab A1"` si cabe en 256 × 256 × 256; si no, `"Artillery Sidewinder"` si cabe en
            300 × 300 × 400; si no, `"no cabe"`. Se puede **girar en el plano** de la cama (intercambiar x e y),
            pero no tumbar (z es la altura).
          starter: |
            def impresora(pieza):
                pass
          solution: |
            def cabe(pieza, cama):
                x, y, z = pieza
                cx, cy, cz = cama
                return z <= cz and ((x <= cx and y <= cy) or (y <= cx and x <= cy))

            def impresora(pieza):
                if cabe(pieza, (256, 256, 256)):
                    return "Bambu Lab A1"
                if cabe(pieza, (300, 300, 400)):
                    return "Artillery Sidewinder"
                return "no cabe"
          tests:
            - {desc: "Soporte del cartel", call: "impresora((176, 45, 38))", expected: "Bambu Lab A1"}
            - {desc: "Pieza grande", call: "impresora((280, 120, 50))", expected: "Artillery Sidewinder"}
            - {desc: "Pieza alta", call: "impresora((100, 100, 300))", expected: "Artillery Sidewinder"}
            - {desc: "Demasiado grande", call: "impresora((350, 100, 20))", expected: "no cabe"}
        - id: c3
          type: code
          points: 2
          prompt: |
            Escribe `masa_coste(volumen_cm3, densidad, precio_kg)` que devuelva una tupla `(gramos, euros)`:
            gramos = volumen × densidad (redondeado a 1 decimal) y euros = gramos × precio_kg / 1000 (redondeado
            a 2 decimales).

            Ejemplo: 40 cm³ de PLA (1,24 g/cm³) a 20 €/kg → `(49.6, 0.99)`
          starter: |
            def masa_coste(volumen_cm3, densidad, precio_kg):
                pass
          solution: |
            def masa_coste(volumen_cm3, densidad, precio_kg):
                gramos = round(volumen_cm3 * densidad, 1)
                return gramos, round(gramos * precio_kg / 1000, 2)
          tests:
            - {desc: "Soporte en PLA", call: "masa_coste(40, 1.24, 20)", expected: [49.6, 0.99]}
            - {desc: "Capuchón en PETG", call: "masa_coste(10, 1.27, 25)", expected: [12.7, 0.32]}

  - id: m4s3
    title: "Equipo B: electrónica y energía del cartel"
    hours: 2
    kind: lesson
    foto:
      indicaciones: "Foto de la electrónica sobre la mesa: batería 18650, TP4056, MT3608, ESP32-C3 y la tira encendida; y del polímetro midiendo el consumo."
    theory: |
      ## El sistema de energía

      ![Esquema de bloques: USB-C, TP4056, batería 18650, interruptor, MT3608 a 5 V, ESP32-C3 y tira WS2812](/img/smart_sign_energia.svg)
      *El TP4056 carga la batería; el MT3608 eleva sus 3,7 V a los 5 V que necesitan la placa y la tira.*

      | Bloque | Qué hace | Cuidado con… |
      |---|---|---|
      | **Batería 18650** (Li-ion, 3,7 V nominal, ~2500 mAh) | Almacena la energía | No cortocircuitar nunca; portapilas con la polaridad marcada |
      | **TP4056** (con protección DW01) | Carga la batería por USB-C (hasta 4,2 V) y la protege de descargas profundas | Usar el módulo **con protección** (salida OUT+ / OUT−) |
      | **MT3608** (elevador *boost*) | Sube 3,7 V → **5,0 V** | **Ajusta el potenciómetro a 5,0 V con el polímetro antes** de conectar la placa |
      | **ESP32-C3 SuperMini** | El cerebro: WiFi y control de la tira | Se alimenta por el pin 5V; GND común con todo |
      | **Tira WS2812** (12 LED) | La luz del cartel | DIN en **IO3**; brillo bajo para ahorrar |

      ## ¿Cuánto dura la batería?

      El elevador no es perfecto (eficiencia **η ≈ 85 %**): lo que consume el circuito a 5 V hay que «pagarlo»
      a 3,7 V con un poco más de corriente:

      ```
      I_batería = I_5V × 5 V / (3,7 V × η)
      autonomía (h) = capacidad útil (mAh) / I_batería (mA)       (útil ≈ 80 % de la nominal)
      ```

      Ejemplo: placa + 12 LED a brillo bajo ≈ 60 mA a 5 V → I_batería = 60 × 5 / (3,7 × 0,85) ≈ 95 mA →
      autonomía ≈ 2000 / 95 ≈ **21 h**. ✅ Más de una jornada escolar (8 h).

      ⚠️ **Truco del consumo oculto**: cada LED WS2812 **apagado** sigue gastando ≈ 1 mA (su chip está
      encendido). 12 LED = 12 mA aunque no luzcan. Por eso en la versión 2 se pone un MOSFET para cortar la
      alimentación de la tira.

      ## Reposo profundo (deepsleep)

      Si el cartel solo tiene que actualizarse de vez en cuando, la ESP32-C3 puede **dormir**: apaga el
      procesador y la WiFi y se despierta pasado un tiempo. Durante el reposo consume micro- o miliamperios
      (según la placa) en lugar de 20-80 mA. **Ojo**: al despertar, el programa empieza **desde el principio**.

      ```python
      import machine
      machine.deepsleep(10_000)    # duerme 10 s y se reinicia
      ```

      **Medir el consumo**: polímetro en **mA** (o µA) **en serie** entre la batería y el TP4056, nunca en
      paralelo. Cambia la punta roja al borne de corriente.

      ## La PCB del cartel (KiCad / EasyEDA)

      En lugar de cables sueltos, el Equipo B diseña una **placa de circuito impreso** con: zócalo para la
      ESP32-C3, conector **JST** para la batería, conector de 3 pines para la tira (5V · DIN · GND),
      huecos para los módulos TP4056 y MT3608 e interruptor. Pistas de alimentación anchas (≥ 0,8 mm).
      Se suelda en la **estación de soldadura** (350 °C, punta limpia, extracción de humos) empezando por los
      componentes más bajos.

      > 🔗 Para aprender a diseñar la PCB paso a paso, consulta el taller **PicoLab·IA** en *Recursos*.

      ## Pines del cartel (ESP32-C3 SuperMini)

      | Señal | Pin | Nota |
      |---|---|---|
      | DIN de la tira WS2812 | **IO3** | Evitamos **IO8**: es un pin de arranque y lleva el LED azul de la placa |
      | 5V | 5V | Desde el MT3608 |
      | GND | GND | Común a todo |
    examples:
      - title: "Prueba de la tira y del reposo profundo"
        explanation: "Enciende la tira en verde, rojo y azul (2 s cada color), la apaga y duerme 10 s. Mide el consumo en cada fase con el polímetro."
        esp32_c3: |
          from machine import Pin, deepsleep
          from neopixel import NeoPixel
          import time

          NUM_LEDS = 12
          BRILLO = 0.2                              # MicroPython no tiene np.brightness: se escala el color
          tira = NeoPixel(Pin(3, Pin.OUT), NUM_LEDS) # DIN → IO3 (no uses IO8)

          def pintar(rgb):
              tira.fill(tuple(int(c * BRILLO) for c in rgb))
              tira.write()

          for color in ((0, 255, 0), (255, 0, 0), (0, 0, 255)):
              pintar(color)
              time.sleep(2)                          # mide aquí el consumo con la tira encendida
          pintar((0, 0, 0))
          print("A dormir 10 s...")
          time.sleep(1)                              # margen para poder parar el programa desde Thonny
          deepsleep(10_000)                          # al despertar, el programa vuelve a empezar
        pico_w: |
          from machine import Pin, deepsleep
          from neopixel import NeoPixel
          import time

          NUM_LEDS = 12
          BRILLO = 0.2
          tira = NeoPixel(Pin(22, Pin.OUT), NUM_LEDS)  # DIN → GP22

          def pintar(rgb):
              tira.fill(tuple(int(c * BRILLO) for c in rgb))
              tira.write()

          for color in ((0, 255, 0), (255, 0, 0), (0, 0, 255)):
              pintar(color)
              time.sleep(2)
          pintar((0, 0, 0))
          time.sleep(1)
          deepsleep(10_000)
        esp32_s3: |
          from machine import Pin, deepsleep
          from neopixel import NeoPixel
          import time

          NUM_LEDS = 12
          BRILLO = 0.2
          tira = NeoPixel(Pin(21, Pin.OUT), NUM_LEDS)  # DIN → GPIO 21

          def pintar(rgb):
              tira.fill(tuple(int(c * BRILLO) for c in rgb))
              tira.write()

          for color in ((0, 255, 0), (255, 0, 0), (0, 0, 255)):
              pintar(color)
              time.sleep(2)
          pintar((0, 0, 0))
          time.sleep(1)
          deepsleep(10_000)
    practice: |
      ### Práctica de taller · Equipo B (2 sesiones)

      1. **Antes de conectar nada**: alimenta el MT3608 con la batería y ajusta su salida a **5,0 V** con el polímetro.
      2. Monta batería + TP4056 + interruptor + MT3608 y comprueba las tensiones en cada punto (tabla en la bitácora).
      3. Conecta la ESP32-C3 y la tira (DIN → IO3) y ejecuta la prueba. Puedes probar el código antes en el
         simulador **Wokwi** (wokwi.com) con una ESP32-C3 y una tira WS2812.
      4. Mide la corriente **en serie** con la batería: tira en verde, en rojo, en azul, apagada y en deepsleep.
      5. Diseña el esquema de la PCB en KiCad o EasyEDA con los conectores acordados en el contrato de medidas.
    evaluation:
      intro: "Necesitas un 75 %."
      items:
        - id: q1
          type: quiz
          points: 1
          question: "¿Qué hay que hacer con el MT3608 antes de conectar la ESP32-C3?"
          options:
            - {id: a, text: "Ajustar su salida a 5,0 V con el potenciómetro y el polímetro."}
            - {id: b, text: "Nada, viene ajustado de fábrica a 5 V.", feedback: "Suele venir a otra tensión (incluso más de 20 V): sin ajustar puede quemar la placa."}
            - {id: c, text: "Conectarlo al revés para probarlo.", feedback: "Nunca: invertir la polaridad lo destruye."}
          answer: a
        - id: q2
          type: quiz
          points: 1
          question: "¿Cómo se conecta el polímetro para medir la corriente que da la batería?"
          options:
            - {id: a, text: "En serie, abriendo el circuito entre la batería y el TP4056, en la escala de mA."}
            - {id: b, text: "En paralelo con la batería.", feedback: "En modo corriente, en paralelo es un cortocircuito: puede fundir el fusible del polímetro."}
          answer: a
        - id: c1
          type: code
          points: 3
          prompt: |
            Escribe `corriente_bateria(i_5v_mA, eficiencia)` que devuelva la corriente que sale de la batería
            (3,7 V) para dar `i_5v_mA` a 5 V con el rendimiento indicado, redondeada a 1 decimal.

            Ejemplo: `corriente_bateria(60, 0.85)` → `95.4`
          starter: |
            def corriente_bateria(i_5v_mA, eficiencia):
                pass
          solution: |
            def corriente_bateria(i_5v_mA, eficiencia):
                return round(i_5v_mA * 5 / (3.7 * eficiencia), 1)
          tests:
            - {desc: "Ejemplo de la teoría", call: "corriente_bateria(60, 0.85)", expected: 95.4}
            - {desc: "Boost ideal", call: "corriente_bateria(37, 1)", expected: 50.0}
        - id: c2
          type: code
          points: 3
          prompt: |
            Escribe `autonomia_h(capacidad_mAh, i_bat_mA)` que devuelva las horas de funcionamiento usando solo el
            **80 %** de la capacidad (para no descargar la batería del todo), redondeadas a 1 decimal.

            Ejemplo: `autonomia_h(2500, 95.4)` → `21.0`
          starter: |
            def autonomia_h(capacidad_mAh, i_bat_mA):
                pass
          solution: |
            def autonomia_h(capacidad_mAh, i_bat_mA):
                return round(capacidad_mAh * 0.8 / i_bat_mA, 1)
          tests:
            - {desc: "Ejemplo", call: "autonomia_h(2500, 95.4)", expected: 21.0}
            - {desc: "Batería pequeña", call: "autonomia_h(1000, 200)", expected: 4.0}

  - id: m4s4
    title: "Sprint Review 1: demo de los dos equipos"
    hours: 2
    kind: challenge
    foto:
      indicaciones: "Foto de la demo: las piezas impresas con el metacrilato encajado junto a la electrónica con la tira encendida y funcionando con batería."
    theory: |
      ## Qué se enseña en la Sprint Review

      | Equipo A · Mecánica | Equipo B · Electrónica |
      |---|---|
      | Probeta y juego medido de la ranura elegida | Tensiones medidas en cada punto (batería, TP4056, MT3608) |
      | Soporte, tapa y capuchón impresos | Tira encendida en verde, rojo y azul **con batería** |
      | Metacrilato encajado y canal de la tira | Tabla de consumos (encendida, apagada, deepsleep) |
      | Tiempo de impresión, gramos y coste | Autonomía estimada para 8 h de clase |

      ## Consumo medio con reposo

      Si el cartel pasa parte del tiempo dormido, la corriente **media** es una media **ponderada por el tiempo**:

      ```
      I_media = (I_activo · t_activo + I_reposo · t_reposo) / (t_activo + t_reposo)
      ```

      Ejemplo: despierto 2 s a 80 mA y dormido 58 s a 1 mA → (80·2 + 1·58) / 60 ≈ **3,6 mA**.

      ## Retrospectiva (10 minutos)

      Cada miembro escribe en un pósit: 😀 qué ha ido bien · 😕 qué mejorar · 💡 una idea para el Sprint 2.
      Se elige **una** mejora concreta y se apunta en el tablero.
    examples:
      - title: "Lista de comprobación de la demo"
        explanation: "Ejecútala en la placa o en el ordenador para no olvidar nada durante la demo."
        pico_w: |
          demo = {
              "A": ["probeta y juego medido", "soporte, tapa y capuchón", "metacrilato encajado", "gramos y coste"],
              "B": ["tensiones medidas", "tira con batería", "tabla de consumos", "autonomía estimada"],
          }
          for equipo, puntos in demo.items():
              print("Equipo", equipo)
              for p in puntos:
                  print("  [ ]", p)
        esp32_s3: |
          demo = {
              "A": ["probeta y juego medido", "soporte, tapa y capuchón", "metacrilato encajado", "gramos y coste"],
              "B": ["tensiones medidas", "tira con batería", "tabla de consumos", "autonomía estimada"],
          }
          for equipo, puntos in demo.items():
              print("Equipo", equipo)
              for p in puntos:
                  print("  [ ]", p)
    practice: |
      ### Sprint Review (2 sesiones)

      1. **Preparación**: cada equipo ensaya su demo de 4 minutos con la lista de comprobación.
      2. **Demo**: el Equipo A enseña las piezas con el metacrilato encajado; el Equipo B, la electrónica
         funcionando con batería. El otro equipo y el profesor hacen preguntas.
      3. **Retrospectiva** y actualización del tablero para el Hito de integración (misión 5).
    evaluation:
      intro: "Sprint Review 1. Necesitas un 75 %."
      items:
        - id: c1
          type: code
          points: 4
          prompt: |
            Escribe `consumo_medio(i_on, t_on, i_off, t_off)` que devuelva la corriente media en mA (redondeada a 1
            decimal) de un cartel que está `t_on` segundos activo consumiendo `i_on` mA y `t_off` segundos en reposo
            consumiendo `i_off` mA. Si el tiempo total es 0, devuelve 0.

            Ejemplo: `consumo_medio(80, 2, 1, 58)` → `3.6`
          starter: |
            def consumo_medio(i_on, t_on, i_off, t_off):
                pass
          solution: |
            def consumo_medio(i_on, t_on, i_off, t_off):
                total = t_on + t_off
                if total == 0:
                    return 0
                return round((i_on * t_on + i_off * t_off) / total, 1)
          tests:
            - {desc: "Ejemplo", call: "consumo_medio(80, 2, 1, 58)", expected: 3.6}
            - {desc: "Siempre encendido", call: "consumo_medio(60, 10, 1, 0)", expected: 60.0}
            - {desc: "Sin tiempo", call: "consumo_medio(60, 0, 1, 0)", expected: 0}
        - id: q1
          type: quiz
          points: 1
          question: "En la retrospectiva, ¿qué se decide?"
          options:
            - {id: a, text: "Una mejora concreta del modo de trabajar para el siguiente sprint."}
            - {id: b, text: "Quién tiene la culpa de los retrasos.", feedback: "La retrospectiva mira al proceso, no busca culpables."}
          answer: a
