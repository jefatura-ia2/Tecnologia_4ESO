sections:
  - id: m1s1
    title: "Thonny, REPL y Python esencial"
    hours: 2
    kind: lesson
    theory: |
      ## El microcontrolador: el cerebro de nuestras máquinas

      Durante el curso programaremos una **Raspberry Pi Pico W** o una **ESP32-S3** para gobernar
      máquinas neumáticas: abrirá electroválvulas, leerá pulsadores y finales de carrera y decidirá
      qué hacer en cada momento. Es exactamente lo que hace un **autómata programable (PLC)** en una fábrica.

      Escribimos el programa en **Thonny** con **MicroPython**:

      - **REPL** (`>>>`): pruebas rápidas, orden a orden.
      - **main.py**: el programa que la placa ejecuta sola al recibir corriente.

      Instalación: **Pico W** → mantén BOOTSEL al conectar y arrastra el `.uf2`. **ESP32-S3** → en Thonny,
      *Configurar intérprete → MicroPython (ESP32) → Instalar o actualizar MicroPython*, familia ESP32-S3.

      ## Python esencial

      ```python
      presion = 4.5            # float
      ciclos = 0               # int
      cilindro = "A"           # str
      en_marcha = True         # bool

      if presion > 6:
          print("¡Demasiada presión!")
      elif presion < 3:
          print("Presión baja")
      else:
          print("Presión correcta")

      for i in range(3):       # 0, 1, 2
          ciclos += 1
      ```

      ### Funciones

      ```python
      def area_circulo(d):
          return 3.1416 * d * d / 4
      ```

      ### Listas y diccionarios

      ```python
      registro = ["A+", "A-", "A+", "A-"]        # lista: elementos en orden
      registro.append("A+")
      print(len(registro), registro[0], registro[-1])

      valvulas = {"EV1": 0, "EV2": 1}             # diccionario: clave → valor
      valvulas["EV1"] = 1
      for nombre, estado in valvulas.items():
          print(nombre, estado)
      ```

      `lista.count(x)` cuenta cuántas veces aparece `x`; `dic.get(clave, defecto)` lee sin error si no existe.
    examples:
      - title: "Primer programa: informe de la placa"
        explanation: "Ejecútalo en el REPL o guárdalo como main.py."
        pico_w: |
          import machine, gc
          print("Hola desde la Pico W")
          print("Frecuencia:", machine.freq() // 1_000_000, "MHz")
          print("RAM libre:", gc.mem_free(), "bytes")
          for i in range(3):
              print("Cuenta", i)
        esp32_s3: |
          import machine, gc
          print("Hola desde la ESP32-S3")
          print("Frecuencia:", machine.freq() // 1_000_000, "MHz")
          print("RAM libre:", gc.mem_free(), "bytes")
          for i in range(3):
              print("Cuenta", i)
    practice: |
      ### Práctica en clase

      1. Instala MicroPython en tu placa y ejecuta el ejemplo.
      2. En el REPL, crea una lista con 6 movimientos de un cilindro (`"A+"`, `"A-"`…) y cuenta los avances con `count`.
      3. Crea un diccionario con el estado de 4 electroválvulas y escribe un `for` que muestre las que están activadas.
